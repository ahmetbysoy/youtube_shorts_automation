name: "02 — Kanal 1 Secret Kopyalama"
run-name: "Copy base secrets -> _1 channel secrets"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO_PAT: ${{ secrets.REPO_PAT }}
      COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
      STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
    steps:
      - uses: actions/checkout@v7
      - name: Araçlar
        uses: ./.github/actions/setup-tools
        with:
          apt_packages: ''
          python: 'true'
          python_version: '3.11'
          node: 'false'
          pip_requirements: ''
          pip_extra: 'requests pynacl'
      - name: Channel secret'larini kopyala
        run: python3 scripts/copy_channel_secrets.py
