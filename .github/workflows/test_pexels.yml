name: test-pexels-cat
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Aranacak kelime'
        required: false
        default: 'cat'
        type: string
jobs:
  cat:
    runs-on: ubuntu-latest
    env:
      PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
      PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install deps (playwright)
        run: |
          if [ ! -d node_modules/playwright ]; then
            npm init -y >/dev/null 2>&1
            npm i playwright 2>&1 | tail -3
          fi
          npx playwright install chromium --with-deps 2>&1 | tail -3
      - name: video_fetcher ile video indir
        run: |
          mkdir -p out
          echo "PEXELS_COOK length: ${#PEXELS_COOK}"
          echo "PIXABAY_COOK length: ${#PIXABAY_COOK}"
          KW="${{ inputs.keyword }}"
          echo "Aranan kelime: $KW"
          node video_fetcher.js "$KW" out/video.mp4 2>&1 | tail -30
          echo "---dosya---"
          ls -la out/
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          echo "---ffprobe---"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,duration,r_frame_rate -of default=noprint_wrappers=1 out/video.mp4 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: fetched-video
          path: out/
