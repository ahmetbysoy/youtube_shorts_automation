name: Hourly Prune Low-View YouTube Videos

on:
  schedule:
    # Saatte iki kez (:07 ve :37 UTC): 1 saatten eski ve <100 izlenme videoları temizle
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Hedef kanal (boş/all=tümü veya 1, 2, 3, 4)'
        required: false
        default: 'all'
      slot_epoch:
        description: 'Üretim kapısı zaman dilimi epoch (isteğe bağlı)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: prune-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # ÖN İŞ: 4 KANAL SIRINDAN FARKLI (BENZERSİZ) OLANLARI BELİRLE
  # =========================================================================
  # Aynı kanalın çerezleri birden fazla kanal slotuna kopyalanmışsa aynı kanalı
  # 4 kez üst üste taramak yerine yalnızca benzersiz oturumları çalıştırır.
  channel-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      distinct_csv: ${{ steps.dedup.outputs.distinct_csv }}
    steps:
      - name: Benzersiz Kanal Oturumlarını Hesapla
        id: dedup
        env:
          TARGET_CHANNEL: ${{ github.event.inputs.target_channel || 'all' }}
          S1: ${{ secrets.STORAGE_STATE_JSON_1 || secrets.COOKIES_JSON_1 || secrets.STORAGE_STATE_JSON || secrets.COOKIES_JSON }}
          S2: ${{ secrets.STORAGE_STATE_JSON_2 || secrets.COOKIES_JSON_2 }}
          S3: ${{ secrets.STORAGE_STATE_JSON_3 || secrets.COOKIES_JSON_3 }}
          S4: ${{ secrets.STORAGE_STATE_JSON_4 || secrets.COOKIES_JSON_4 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re

          def fingerprint(raw: str, idx: int) -> str:
              raw = (raw or "").strip()
              if not raw:
                  return f"empty-{idx}"
              try:
                  data = json.loads(raw)
                  cookies = data.get("cookies", data) if isinstance(data, dict) else data
                  auth = sorted(
                      f"{c.get('name')}={c.get('value')}"
                      for c in (cookies if isinstance(cookies, list) else [])
                      if isinstance(c, dict) and c.get("name") in {
                          "SID", "HSID", "SSID", "APISID", "SAPISID",
                          "__Secure-1PSID", "__Secure-3PSID", "LOGIN_INFO"
                      }
                  )
                  if auth:
                      return hashlib.sha256("|".join(auth).encode()).hexdigest()[:16]
              except Exception:
                  pass
              return hashlib.sha256(raw.encode()).hexdigest()[:16]

          target = re.sub(r"[^0-9a-zA-Z]", "", os.environ.get("TARGET_CHANNEL", "all") or "all").lower()
          if target in {"1", "2", "3", "4"}:
              distinct = [int(target)]
              print(f"Hedef kanal parametresi aktif: {distinct}")
          else:
              seen = {}
              distinct = []
              for idx in (1, 2, 3, 4):
                  raw = os.environ.get(f"S{idx}", "")
                  if idx > 1 and not raw.strip():
                      print(f"Kanal #{idx} için ayrı oturum sırrı tanımlı değil -> atlanıyor")
                      continue
                  fp = fingerprint(raw, idx)
                  if fp not in seen:
                      seen[fp] = idx
                      distinct.append(idx)
                  else:
                      print(f"Kanal #{idx} oturumu Kanal #{seen[fp]} ile aynı -> tekrarlanmayacak")
              if not distinct:
                  distinct = [1]
          csv_val = ",".join(str(x) for x in distinct)
          print(f"Çalıştırılacak benzersiz kanallar: {distinct} (csv={csv_val})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"distinct_csv={csv_val}\n")
          PY

  prune-videos:
    needs: channel-map
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Paylaşımlı Google oturumu (daily_shorts + draft_publisher ile aynı kilit):
    # eşzamanlı Studio girişleri çerez rotasyonu çakışması yaratmasın.
    concurrency:
      group: youtube-studio-browser-session
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel_id: [1]

    steps:
      - name: Üretim Kapısı (Atomik Kilit ve Kota Denetimi)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          WORKFLOW_FILE: hourly_pruner.yml
          LOCK_NAME: pruner-studio-lock
          MIN_INTERVAL_SEC: '1500'
          MAX_RUNS_PER_DAY: '52'
          SLOT_EPOCH: ${{ github.event.inputs.slot_epoch || '' }}
        run: bash scripts/production_gate.sh

      - name: Depoyu Çek (Checkout)
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7

      - name: Sistem Kütüphaneleri + Python + Node + Playwright Önbelleği
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.github/actions/setup-tools
        with:
          install-python: 'false'

      - name: Kanal #${{ matrix.channel_id }} Kimlik Bilgilerini Enjekte Et
        if: steps.gate.outputs.proceed == 'true'
        env:
          Distinct_CSV: ${{ needs.channel-map.outputs.distinct_csv }}
          MATRIX_CHANNEL_ID: ${{ matrix.channel_id }}
          CHANNEL_ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', matrix.channel_id)] }}
          CHANNEL_COOKIES_JSON: ${{ secrets[format('COOKIES_JSON_{0}', matrix.channel_id)] }}
          CHANNEL_STORAGE_STATE_JSON: ${{ secrets[format('STORAGE_STATE_JSON_{0}', matrix.channel_id)] }}
          YT_EMAIL_1: ${{ secrets.YT_EMAIL_1 }}
          YT_PASSWORD_1: ${{ secrets.YT_PASSWORD_1 }}
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          STORAGE_STATE_JSON_1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          YT_EMAIL_2: ${{ secrets.YT_EMAIL_2 }}
          YT_PASSWORD_2: ${{ secrets.YT_PASSWORD_2 }}
          COOKIES_JSON_2: ${{ secrets.COOKIES_JSON_2 }}
          STORAGE_STATE_JSON_2: ${{ secrets.STORAGE_STATE_JSON_2 }}
          YT_EMAIL_3: ${{ secrets.YT_EMAIL_3 }}
          YT_PASSWORD_3: ${{ secrets.YT_PASSWORD_3 }}
          COOKIES_JSON_3: ${{ secrets.COOKIES_JSON_3 }}
          STORAGE_STATE_JSON_3: ${{ secrets.STORAGE_STATE_JSON_3 }}
          YT_EMAIL_4: ${{ secrets.YT_EMAIL_4 }}
          YT_PASSWORD_4: ${{ secrets.YT_PASSWORD_4 }}
          COOKIES_JSON_4: ${{ secrets.COOKIES_JSON_4 }}
          STORAGE_STATE_JSON_4: ${{ secrets.STORAGE_STATE_JSON_4 }}
          FALLBACK_EMAIL: ${{ secrets.YT_EMAIL }}
          FALLBACK_PASSWORD: ${{ secrets.YT_PASSWORD }}
          FALLBACK_COOKIES: ${{ secrets.COOKIES_JSON }}
          FALLBACK_STORAGE: ${{ secrets.STORAGE_STATE_JSON }}
        run: |
          if ! echo ",${Distinct_CSV}," | grep -q ",${MATRIX_CHANNEL_ID},"; then
            echo "SKIP_DUPLICATE_CHANNEL=true" >> "$GITHUB_ENV"
            echo "⏭️ Kanal #${MATRIX_CHANNEL_ID} benzersiz kanal listesinde (${Distinct_CSV}) değil; atlanıyor."
            exit 0
          fi
          umask 077
          CID="${MATRIX_CHANNEL_ID}"
          EMAIL_VAR="YT_EMAIL_${CID}"
          PASS_VAR="YT_PASSWORD_${CID}"
          COOKIE_VAR="COOKIES_JSON_${CID}"
          STORAGE_VAR="STORAGE_STATE_JSON_${CID}"

          ACTIVE_EMAIL="${!EMAIL_VAR:-$FALLBACK_EMAIL}"
          ACTIVE_PASS="${!PASS_VAR:-$FALLBACK_PASSWORD}"
          ACTIVE_COOKIES="${!COOKIE_VAR:-$FALLBACK_COOKIES}"
          ACTIVE_STORAGE="${!STORAGE_VAR:-$FALLBACK_STORAGE}"

          echo "YT_EMAIL=${ACTIVE_EMAIL}" >> .env
          echo "YT_PASSWORD=${ACTIVE_PASS}" >> .env
          chmod 600 .env || true

          if [ -n "${ACTIVE_COOKIES}" ]; then
            printf '%s' "${ACTIVE_COOKIES}" > cookies.json
            chmod 600 cookies.json
          fi
          if [ -n "${ACTIVE_STORAGE}" ]; then
            printf '%s' "${ACTIVE_STORAGE}" > storage_state.json
            chmod 600 storage_state.json
          fi

      - name: 1 Saatten Eski Düşük İzlenmeli Videoları Temizle (Kanal #${{ matrix.channel_id }})
        if: steps.gate.outputs.proceed == 'true' && env.SKIP_DUPLICATE_CHANNEL != 'true'
        env:
          MATRIX_CHANNEL_ID: ${{ matrix.channel_id }}
          PRUNE_MIN_VIEWS: ${{ vars.PRUNE_MIN_VIEWS || '100' }}
          PRUNE_MIN_AGE_MINUTES: ${{ vars.PRUNE_MIN_AGE_MINUTES || '60' }}
          PRUNE_MAX_DELETIONS: ${{ vars.PRUNE_MAX_DELETIONS || '10' }}
          PRUNE_MIN_REMAINING: ${{ vars.PRUNE_MIN_REMAINING || '1' }}
          PRUNE_DRY_RUN: ${{ vars.PRUNE_DRY_RUN || 'false' }}
          PRUNE_QUIET_LOG: 'true'
          PRUNE_PERSIST_STATE: 'true'
          PRUNE_FAIL_ON_ZERO_SCAN: 'true'
          HEADLESS: 'true'
        run: |
          echo "========================================================"
          echo " 🧹 FAZ 10: SAATLİK DÜŞÜK İZLENME TEMİZLEYİCİ (Kanal #${MATRIX_CHANNEL_ID})"
          echo "   Eşik: >= ${PRUNE_MIN_AGE_MINUTES} dk yayın süresi VE < ${PRUNE_MIN_VIEWS} görüntüleme"
          echo "   Güvenlik: En fazla ${PRUNE_MAX_DELETIONS} silme/çalışma, en az ${PRUNE_MIN_REMAINING} video korunur"
          echo "   Dry-Run: ${PRUNE_DRY_RUN}"
          echo "========================================================"
          xvfb-run -a --server-args="-screen 0 1366x900x24" node prune_low_performers.js

      - name: Temizlik Durumunu ve Güncel Oturumu Depoya Geri Yaz (Persist State)
        if: always() && steps.gate.outputs.proceed == 'true' && env.SKIP_DUPLICATE_CHANNEL != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          if [ -f "prune_state.json" ]; then
            echo "[*] prune_state.json GitHub Contents API ile ana dala kaydediliyor..."
            B64_CONTENT=$(base64 -w 0 prune_state.json)
            EXISTING_SHA=$(curl -s -H "Authorization: Bearer ${GH_PAT}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/prune_state.json?ref=main" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
            if [ -n "${EXISTING_SHA}" ]; then
              PAYLOAD=$(printf '{"message":"chore: pruner durumu güncellendi","content":"%s","sha":"%s","branch":"main"}' "${B64_CONTENT}" "${EXISTING_SHA}")
            else
              PAYLOAD=$(printf '{"message":"chore: pruner durumu güncellendi","content":"%s","branch":"main"}' "${B64_CONTENT}")
            fi
            HTTP_CODE=$(curl -s -o /tmp/prune_put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/prune_state.json" \
              -d "${PAYLOAD}")
            echo "[*] GitHub Contents API yanıt kodu: ${HTTP_CODE}"
          fi

      - name: Temizlik Raporunu Yükle (Artifact - Kanal #${{ matrix.channel_id }})
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prune-report-channel-${{ matrix.channel_id }}-${{ github.run_number }}
          path: |
            prune_report.json
            prune_state.json
            logs/*.png
            logs/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Güvenlik Temizliği (Shred Secrets)
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          shred -u .env cookies.json storage_state.json session.har 2>/dev/null || rm -f .env cookies.json storage_state.json session.har

      - name: Üretim Kapısı Kilidini Serbest Bırak
        if: always() && steps.gate.outputs.lock_acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          LOCK_NAME: pruner-studio-lock
        run: bash scripts/production_gate.sh --release

  # =========================================================================
  # ZİNCİRLEME YEDEK TETİKLEYİCİ (CRON-FALLBACK)
  # =========================================================================
  # GitHub Actions 'schedule' tetikleyicisi yoğun saatlerde gecikirse:
  # 1) Bir sonraki saat dilimi için kendi yedek tetiklemesini kontrol eder.
  # 2) daily_shorts.yml son 2.5 saatte (9000 sn) hiç çalışmamışsa onu da uyandırır.
  cron-kick:
    needs: [prune-videos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Geciken İş Akışlarını Yedek Tetikle (Self & Shorts Fallback)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          NOW=$(date -u +%s)

          # 1) daily_shorts.yml son 9000 sn (2.5 saat) içinde çalışmadıysa uyandır
          LAST_SHORTS=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/daily_shorts.yml/runs?per_page=5" | \
            python3 -c "
          import json, sys, datetime
          try:
              runs = json.load(sys.stdin).get('workflow_runs', [])
              active = [r for r in runs if r.get('status') in ('in_progress', 'queued', 'waiting')]
              if active:
                  print(-1)
              elif runs:
                  ts = runs[0]['created_at'].replace('Z', '+00:00')
                  print(int(datetime.datetime.fromisoformat(ts).timestamp()))
              else:
                  print(0)
          except Exception:
              print(0)
          ")

          if [ "$LAST_SHORTS" = "-1" ]; then
            echo "[+] daily_shorts.yml zaten aktif/kuyrukta; yedek tetikleme gerekmiyor."
          elif [ "$LAST_SHORTS" -gt 0 ]; then
            GAP=$((NOW - LAST_SHORTS))
            echo "[*] daily_shorts.yml son çalışmadan bu yana geçen süre: ${GAP} sn"
            if [ "$GAP" -ge 9000 ]; then
              SLOT=$((NOW / 7200))
              echo "[!] daily_shorts.yml >2.5 saattir tetiklenmemiş -> workflow_dispatch ile uyandırılıyor (slot=${SLOT})..."
              curl -s -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/workflows/daily_shorts.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"target_channel\":\"all\",\"slot_epoch\":\"${SLOT}\"}}" || true
            fi
          fi
          exit 0
