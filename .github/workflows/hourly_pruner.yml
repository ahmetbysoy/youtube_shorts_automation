name: Every 30 min: Prune Low-View YouTube Videos

on:
  schedule:
    # Her 30 dakikada bir: 1 saatten eski ve <100 izlenme videoları sil
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Sistem Kütüphaneleri + Node + Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2
          npm ci
          npx playwright install chromium --with-deps

      - name: Kimlik Bilgilerini Enjekte Et (Google Drive'dan alınan oturum)
        env:
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: |
          umask 077
          mkdir -p session_capture
          printf '%s' "${STORAGE_STATE_JSON}" > storage_state.json
          printf '%s' "${COOKIES_JSON}" > cookies.json

      - name: 1 Saatten Eski <100 Izlenme Videolarını Temizle (prune_low_performers)
        env:
          PRUNE_MIN_VIEWS: 100
          PRUNE_MIN_AGE_MINUTES: 60
          PRUNE_MAX_DELETIONS: 10
          PRUNE_MIN_REMAINING: 1
          PRUNE_DRY_RUN: false
          PRUNE_QUIET_LOG: true
          PRUNE_PERSIST_STATE: true
          PRUNE_FAIL_ON_ZERO_SCAN: true
          HEADLESS: true
        run: xvfb-run -a --server-args="-screen 0 1366x900x24" node prune_low_performers.js
