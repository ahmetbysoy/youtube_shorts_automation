name: Phase 4B Media and Consumer Probe (no publishing)

on:
  workflow_dispatch:

# This workflow cannot write repository history or publish anything.
permissions:
  contents: read

jobs:
  media-consumer-proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Media-only dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core
          python -m pip install requests==2.34.2 beautifulsoup4==4.15.0 python-dotenv==1.2.4 Pillow==11.3.0 'jsonschema>=4.23,<5'
          npm ci
          npx playwright install --with-deps chromium
      - name: Existing stock cookies only (no Google or YouTube sessions)
        env:
          MEDIA_COOKIES_JSON: ${{ secrets.MEDIA_COOKIES_JSON }}
        run: python -m scripts.media_probe_security cookies --path cookies.json
      - name: Live providers through actual isolated producer and consumer chain
        env:
          # Parse as DATA, no interpolation/source/eval/disk copy. Only exact
          # PEXELS_API_KEY/PIXABAY_API_KEY names can reach their own provider.
          PHASE4_PROVIDER_ENV: ${{ secrets.ENV_FILE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m scripts.phase4b_media_probe
      - name: Safe status summary (partial is NOT acceptance)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('output/phase4b_evidence/evidence.json')
          if p.exists():
              d=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('### Faz 4B — publication-free evidence, not automatic acceptance\n')
                  for name,item in d['providers'].items():
                      f.write(f"- {name}: {item['status']}; scenes={item['selected_scenes']}\n")
                  f.write(f"- Overall: {d.get('overall','incomplete')}; full_acceptance=false\n")
                  f.write('- Explicit scenario fixture + synthetic tone; NOT live Gemini/TTS or visual approval.\n')
          PY
      - name: Audit ONLY staged evidence before upload
        id: audit
        if: always()
        env:
          AUDIT_PROVIDER_ENV: ${{ secrets.ENV_FILE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MEDIA_COOKIES_JSON: ${{ secrets.MEDIA_COOKIES_JSON }}
        run: python -m scripts.media_probe_security audit --path output/phase4b_evidence
      - name: Safe JSON plus necessary Commons composite and inspection frames
        if: ${{ always() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase4b-media-evidence-${{ github.run_id }}
          path: output/phase4b_evidence/
          retention-days: 14
      - name: Remove ephemeral stock cookies
        if: always()
        run: rm -f cookies.json
