name: Phase 4C Cookie Media and Consumer Probe (no publishing)

on:
  workflow_dispatch:
    inputs:
      stock_access_mode:
        description: "Cookie-only is user-approved; auto is the historical explicit API/cookie route"
        required: true
        type: choice
        default: cookie_only
        options: [cookie_only, auto]

# This workflow cannot write repository history or publish anything.
permissions:
  contents: read

jobs:
  media-consumer-proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: APT mirror fix (bounded azure mirror + timeouts)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if path.is_file():
                  text = path.read_text()
                  updated = re.sub(r'https?://(?:[a-z0-9.-]*archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?|mirror\+file:/etc/apt/apt-mirrors\.txt', 'https://azure.archive.ubuntu.com/ubuntu/', text)
                  if updated != text:
                      path.write_text(updated)
          Path('/etc/apt/apt.conf.d/99-phase4b-probe-timeouts').write_text('Acquire::Retries "2";\nAcquire::http::Timeout "25";\nAcquire::https::Timeout "25";\n')
          PY
      - name: Araçları Kur (Python + Node + Playwright + pip adayları)
        uses: ./.github/actions/setup-tools
        with:
          python: 'true'
          python_version: '3.11'
          pip_requirements: ''
          pip_extra: 'requests==2.34.2 beautifulsoup4==4.15.0 python-dotenv==1.2.4 Pillow==11.3.0 jsonschema>=4.23,<5'
          node: 'true'
          node_version: '20'
          node_playwright: 'true'
          playwright_chromium: 'true'
          playwright_with_deps: 'true'
          apt_packages: ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core
          node_check: 'video_fetcher.js scripts/stock_media_catalog.cjs analytics_scraper.js'
      - name: Cookie-only preflight BEFORE provider or system/browser setup
        id: preflight
        env:
          MEDIA_COOKIES_JSON: ${{ secrets.MEDIA_COOKIES_JSON }}
          PEXELS_API_KEY_PRESENT: ${{ secrets.PEXELS_API_KEY != '' }}
          PIXABAY_API_KEY_PRESENT: ${{ secrets.PIXABAY_API_KEY != '' }}
          STOCK_ACCESS_MODE: ${{ inputs.stock_access_mode }}
        run: |
          set -euo pipefail
          if [ "$STOCK_ACCESS_MODE" = "cookie_only" ]; then
            python -m scripts.media_probe_security preflight --path cookies.json --report output/phase4b_evidence/preflight.json
          else
            python -m scripts.media_probe_security cookies --path cookies.json
          fi
      - name: Live providers through actual isolated producer and consumer chain
        env:
          # Parse as DATA, no interpolation/source/eval/disk copy. Only exact
          # PEXELS_API_KEY/PIXABAY_API_KEY names can reach their own provider.
          # Cookie-only loads NO API key/ENV_FILE. Exact legacy names remain
          # available only for a separately requested explicit auto run.
          STOCK_ACCESS_MODE: ${{ inputs.stock_access_mode }}
          PHASE4_PROVIDER_ENV: ${{ inputs.stock_access_mode == 'auto' && secrets.ENV_FILE || '' }}
          PEXELS_API_KEY: ${{ inputs.stock_access_mode == 'auto' && secrets.PEXELS_API_KEY || '' }}
          PIXABAY_API_KEY: ${{ inputs.stock_access_mode == 'auto' && secrets.PIXABAY_API_KEY || '' }}
        run: python -m scripts.phase4b_media_probe --stock-access-mode "$STOCK_ACCESS_MODE"
      - name: Safe status summary (partial is NOT acceptance)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('output/phase4b_evidence/evidence.json')
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps({'phase':'4C','github_run_id':os.environ.get('GITHUB_RUN_ID'),
                  'github_sha':os.environ.get('GITHUB_SHA'),'providers':{},'live_provider_calls':False,
                  'overall':'not_run_infrastructure_or_setup_failure','full_acceptance':False},indent=2)+'\n')
          if p.exists():
              d=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('### Faz 4C — publication-free cookie evidence, not automatic acceptance\n')
                  for name,item in d['providers'].items():
                      f.write(f"- {name}: {item['status']}; scenes={item['selected_scenes']}\n")
                  f.write(f"- Overall: {d.get('overall','incomplete')}; full_acceptance=false\n")
                  f.write('- Explicit scenario fixture + synthetic tone; NOT live Gemini/TTS or visual approval.\n')
          PY
      - name: Audit ONLY staged evidence before upload
        id: audit
        if: always()
        env:
          AUDIT_PROVIDER_ENV: ${{ inputs.stock_access_mode == 'auto' && secrets.ENV_FILE || '' }}
          PEXELS_API_KEY: ${{ inputs.stock_access_mode == 'auto' && secrets.PEXELS_API_KEY || '' }}
          PIXABAY_API_KEY: ${{ inputs.stock_access_mode == 'auto' && secrets.PIXABAY_API_KEY || '' }}
          MEDIA_COOKIES_JSON: ${{ secrets.MEDIA_COOKIES_JSON }}
        run: python -m scripts.media_probe_security audit --path output/phase4b_evidence
      - name: Safe JSON plus necessary Commons composite and inspection frames
        if: ${{ always() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase4c-media-evidence-${{ github.run_id }}
          path: output/phase4b_evidence/
          retention-days: 14
      - name: Remove ephemeral stock cookies
        if: always()
        run: rm -f cookies.json
