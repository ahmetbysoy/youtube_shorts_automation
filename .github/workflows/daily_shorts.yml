name: 15-Minute Blitzkrieg Money Printer

on:
  schedule:
    # REBEL (2026-11-08 Kullanıcı Kararı): 2-3 saatte 1 video (günde 8-12 kaliteli Short), asal olmayan dakika (:13)
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: "Test edilecek tekil kanal ID (ör: 1). Boş/'all' = benzersiz (ayrı hesap) kanallar, teker teker."
        required: false
        default: 'all'
        type: string
      slot_epoch:
        description: "Zincir tetikleyicisi için hedef dilim (epoch saniye). Boşsa hemen başlar."
        required: false
        default: ''
        type: string
      chain:
        description: "1 = zincir (kendi kendini devam ettiren) çalıştırma. Zincir koşuları AYRI concurrency grubundadır; elle/schedule çalıştırmalar zincirin YAYININI iptal etmez."
        required: false
        default: '0'
        type: string
      force_local_thumbnail:
        description: "1 = AI kapak servisini atla, yerel yedek kapak (PIL) ile yayinla (rate-limit yolunun CANLI kaniti)."
        required: false
        default: '0'
        type: string
      skip_thumbnail:
        description: "1 = YouTube Studio kapak secimini atla; varsayilan 0 ile gomulu ilk kare kapak olarak secilir."
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      dry_run:
        description: "1 = sadece video uret (YouTube'a YUKLEME), kalite kontrol + render testi. Uretim akisini test etmek icin."
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

# FAZ 12: Tıkanan/eski job'ı iptal et, en günceli çalıştır (kuyruk tıkanmasın).
# NOT: zincir (cron-kick) tetiklemesi POST'u tamamladıktan SONRA iptal olur,
# bu yüzden kendi kendini devam ettiren zincir bozulmaz.
concurrency:
  # FAZ 12: Iptal (throttle kacinigi) sadece AYNI grup icinde gecerli.
  # Zincir koşuları 'chain=1' ile AYRI grupta calisir -> zincir, devam eden
  # YAYINI iptal etmez (onceki fazda yayin yarida kesiliyordu).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.chain || '0' }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  issues: read

jobs:
  # ---------------------------------------------------------------------------
  # KANAL HARİTASI: 10 secret'in hepsi aynı YouTube hesabını işaret edebilir.
  # Aynı hesabı işaret eden kanallar ayıklanır (günlük kota 10x harcanmasın).
  # Sadece AYRI hesaplara sahip kanallar üretime girer.
  # ---------------------------------------------------------------------------
  channel-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      distinct_csv: ${{ steps.map.outputs.distinct_csv }}
      next_channel: ${{ steps.map.outputs.next_channel }}
      distinct_count: ${{ steps.map.outputs.distinct_count }}
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: Kanal Benzersizlik Analizi
        id: map
        env:
          C1: ${{ secrets.COOKIES_JSON_1 }}
          S1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          C2: ${{ secrets.COOKIES_JSON_2 }}
          S2: ${{ secrets.STORAGE_STATE_JSON_2 }}
          C3: ${{ secrets.COOKIES_JSON_3 }}
          S3: ${{ secrets.STORAGE_STATE_JSON_3 }}
          C4: ${{ secrets.COOKIES_JSON_4 }}
          S4: ${{ secrets.STORAGE_STATE_JSON_4 }}
          C5: ${{ secrets.COOKIES_JSON_5 }}
          S5: ${{ secrets.STORAGE_STATE_JSON_5 }}
          C6: ${{ secrets.COOKIES_JSON_6 }}
          S6: ${{ secrets.STORAGE_STATE_JSON_6 }}
          C7: ${{ secrets.COOKIES_JSON_7 }}
          S7: ${{ secrets.STORAGE_STATE_JSON_7 }}
          C8: ${{ secrets.COOKIES_JSON_8 }}
          S8: ${{ secrets.STORAGE_STATE_JSON_8 }}
          C9: ${{ secrets.COOKIES_JSON_9 }}
          S9: ${{ secrets.STORAGE_STATE_JSON_9 }}
          C10: ${{ secrets.COOKIES_JSON_10 }}
          S10: ${{ secrets.STORAGE_STATE_JSON_10 }}
        run: |
          bash scripts/channel_map.sh

  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: channel-map
    # FAZ C uretim kapisi ortam degiskenleri (medya + LLM cookie'leri globaldir)
    env:
      PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
      PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
      GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
      DAILY_VIDEO_LIMIT: "8"
      MIN_UPLOAD_SPACING_MINUTES: "60"
    # Studio oturum kilidi: ayni anda tek oturum acilir (cerez/cerez catismasi olmasin)
    concurrency:
      group: studio-upload-lock
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Kanal sirasi: BIR video TAMAMEN (kapak + baslik + hashtag + yayin) bitmeden
      # diger kanal BASLAMAZ. Ayni anda 10 kanal calismaz.
      max-parallel: 1
      matrix:
        # distinct_csv duz stringtir ("1" veya "1,2"); JSON dizi GitHub tarafindan
        # secret sanilip maskelenir. split() dizi verir, join() dizi bekler.
        channel_id: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_channel != '' && inputs.target_channel != 'all') && fromJSON(format('["{0}"]', inputs.target_channel)) || fromJSON(format('["{0}"]', join(needs.channel-map.outputs.distinct_csv, '","'))) }}

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: "Uretim Kapisi (Watchdog: Zincir aktifse bu kosu bekci)"
        id: gate
        run: |
          PRODUCE=$(bash scripts/production_gate.sh "${{ github.event_name }}")
          echo "produce=${PRODUCE}" >> "$GITHUB_OUTPUT"
          echo "[GATE] produce=${PRODUCE}"

      - name: "Araçları Kur (önbellekli: apt .deb + pip + node_modules + Chromium; her koşuda yeniden indirme yok)"
        uses: ./.github/actions/setup-tools
        with:
          apt_packages: ffmpeg xvfb fonts-liberation fonts-dejavu-core libass9
          python: 'true'
          python_version: '3.11'
          pip_requirements: 'requirements.txt'
          node: 'true'
          node_version: '20'
          node_playwright: 'true'
          playwright_chromium: 'true'
          python_playwright: 'true'
          node_check: 'youtube_studio_uploader.js video_fetcher.js analytics_scraper.js'

      - name: Gizli Anahtarları ve Kanal Çerezlerini Enjekte Et (Kanal ${{ matrix.channel_id }})
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          CHANNEL_ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', matrix.channel_id)] }}
          CHANNEL_COOKIES_JSON: ${{ secrets[format('COOKIES_JSON_{0}', matrix.channel_id)] }}
          CHANNEL_STORAGE_STATE_JSON: ${{ secrets[format('STORAGE_STATE_JSON_{0}', matrix.channel_id)] }}
          FALLBACK_ENV_FILE: ${{ secrets.ENV_FILE }}
          FALLBACK_COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          FALLBACK_STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
        run: |
          umask 077
          EFFECTIVE_ENV="${CHANNEL_ENV_FILE:-$FALLBACK_ENV_FILE}"
          EFFECTIVE_COOKIES="${CHANNEL_COOKIES_JSON:-$FALLBACK_COOKIES_JSON}"
          EFFECTIVE_STATE="${CHANNEL_STORAGE_STATE_JSON:-$FALLBACK_STORAGE_STATE_JSON}"

          if [ -z "$EFFECTIVE_ENV" ] || [ -z "$EFFECTIVE_COOKIES" ]; then
            echo "::error::Kanal ${{ matrix.channel_id }} için ENV_FILE_${{ matrix.channel_id }} veya COOKIES_JSON_${{ matrix.channel_id }} eksik!"
            exit 1
          fi

          # printf '%s\n' form: format string sabittir, değişken argüman olarak geçer (format injection yok)
          printf '%s\n' "$EFFECTIVE_ENV" > .env
          printf '\nMATRIX_CHANNEL_ID=%s\n' "${{ matrix.channel_id }}" >> .env
          # cookies.json YALNIZ YouTube oturumuna aittir. Pexels/Pixabay cookie'leri (PEXELS_COOK /
          # PIXABAY_COOK) ortam değişkenleri üzerinden, kendi domainlerine izole Playwright context'lerde
          # tüketilir; bu dosyaya HICBIR sekilde karistirilmaz (cookie izolasyonu guvenlik kurali).
          printf '%s\n' "$EFFECTIVE_COOKIES" > cookies.json
          if [ -n "$EFFECTIVE_STATE" ]; then
            printf '%s\n' "$EFFECTIVE_STATE" > storage_state.json
          fi

          python -c "import json; c=json.load(open('cookies.json')); print(f'[OK] Kanal ${{ matrix.channel_id }} cookies.json doğrulandı ({len(c)} YouTube çerezi; medya çerezleri env üzerinden izole)')"

      - name: "Faz C Üretim Güvenlik Kapısı (cookie/sağlık/kota/aralık/stop)"
        id: safety
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOPIC_HISTORY_REF: main
          PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
          PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON || secrets.COOKIES_JSON_1 }}
          DAILY_VIDEO_LIMIT: ${{ env.DAILY_VIDEO_LIMIT }}
          MIN_UPLOAD_SPACING_MINUTES: ${{ env.MIN_UPLOAD_SPACING_MINUTES }}
        run: |
          set +e
          python scripts/production_gate.py \
            --daily-limit "${DAILY_VIDEO_LIMIT:-8}" \
            --min-spacing "${MIN_UPLOAD_SPACING_MINUTES:-60}" \
            --max-errors 3
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
            echo "[SAFETY] production allowed"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "[SAFETY] bu tur atlandi (rc=$rc)"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::Manuel tetiklemede bile kapı izin vermedi — loglara bakin."
            fi
          fi

      - name: Run Orchestrator (Main Pipeline)
        id: orchestrator
        if: ${{ steps.gate.outputs.produce == 'true' && steps.safety.outputs.allow == 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          MATRIX_CHANNEL_ID: ${{ matrix.channel_id }}
          FORCE_LOCAL_THUMBNAIL: ${{ inputs.force_local_thumbnail || '0' }}
          SKIP_THUMBNAIL: ${{ inputs.skip_thumbnail || '0' }}
          SKIP_UPLOAD: ${{ inputs.dry_run || '0' }}
          # frame (varsayilan): baslik-odakli kapak ilk 1.0 sn boyunca videonun ilk karesinde gomuludur.
          # Studio'da videodan sec akisi, gomulu kapakla eslesen kareyi secer; ayri dosya yuklenmez.
          THUMBNAIL_MODE: ${{ vars.THUMBNAIL_MODE || 'frame' }}
          COVER_SECONDS: ${{ vars.COVER_SECONDS || '1.0' }}
          # Yalnız serbest kota için ayrılmış ve faturalandırması KAPALI proje.
          # Projeye ödeme bağlanırsa vars.GEMINI_FREE_VISION_ENABLED değerini hemen 0 yapın.
          GEMINI_FREE_VISION_ENABLED: ${{ vars.GEMINI_FREE_VISION_ENABLED || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gemini Web cookie yalnız main.py → content_engine → Gemini Web metin adaptöründe kullanılır.
          # Değer loglanmaz, dosyaya/artifact'e yazılmaz; web oturumu başarısızsa ücretli API'ye geçilmez.
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          # Stok video (Pexels/Pixabay) cookie'leri. Playwright storage_state cookies JSON dizisi
          # veya "k=v; k=v" string formati kabul edilir; video_fetcher.js otomatik normalize eder.
          PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
          PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
          # Only repository contents access for atomic topic reservations; never logged.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOPIC_HISTORY_REF: main
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Tek video: icerik -> ses -> video -> kapak -> baslik/hashtag -> YAYIN (PUBLIC)
          # Tamami bitmeden sonraki kanal/kullanici devreye girmez (max-parallel: 1).
          xvfb-run -a --server-args="-screen 0 1366x900x24" python main.py --channel_id ${{ matrix.channel_id }}

      - name: "Oturum Cookie'lerini Güncelle (Taze Cookie → GitHub Secret)"
        # GITHUB_TOKEN repo secret'i yazamaz (403 -> KeyError key_id). Yalnizca REPO_PAT
        # secret'i tanimliysa calisir; yoksa ATLANIR. Kosuyu asla kirmizi yapmaz.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          CHANNEL_ID: ${{ matrix.channel_id }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "[ATLANDI] REPO_PAT secret'i tanimli degil -> cerezler GitHub Secret'a yazilmadi (GITHUB_TOKEN bu yetkiye sahip degil)."
            exit 0
          fi
          # Uploader login sonrası yeni cookies.json ve storage_state.json yazdıysa
          # bunları GitHub Secret'a geri yaz — böylece bir sonraki run taze oturumla başlar.
          update_secret() {
            local NAME="$1"
            local FILE="$2"
            [ -f "$FILE" ] || return 0
            local SIZE
            SIZE=$(wc -c < "$FILE")
            [ "$SIZE" -lt 100 ] && return 0

            local PK_RESPONSE PK_HTTP PK_JSON API_MESSAGE KEY_DATA KEY_ID PUB_KEY ENC PUT_RESPONSE PUT_HTTP PUT_JSON
            PK_RESPONSE=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key") || {
              echo "::warning::${NAME}: GitHub public-key isteği başarısız; secret güncellenmedi."
              return 0
            }
            PK_HTTP="${PK_RESPONSE##*$'\n'}"
            PK_JSON="${PK_RESPONSE%$'\n'*}"
            if [ "$PK_HTTP" != "200" ]; then
              API_MESSAGE=$(printf '%s' "$PK_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("message") or "API error")' 2>/dev/null || printf 'JSON olmayan yanit')
              echo "::warning::${NAME}: GitHub public-key API HTTP ${PK_HTTP}: ${API_MESSAGE}. REPO_PAT için repository Secrets read/write yetkisi gerekli."
              return 0
            fi
            KEY_DATA=$(printf '%s' "$PK_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("key_id") and d.get("key"); print(d["key_id"]); print(d["key"])' 2>/dev/null) || {
              echo "::warning::${NAME}: GitHub public-key yanıtında key_id/key yok; REPO_PAT yetkisini kontrol et."
              return 0
            }
            KEY_ID=$(printf '%s\n' "$KEY_DATA" | sed -n '1p')
            PUB_KEY=$(printf '%s\n' "$KEY_DATA" | sed -n '2p')

            ENC=$(python3 -c "import base64,sys; from nacl.public import PublicKey,SealedBox; pk=PublicKey(base64.b64decode(sys.argv[1])); print(base64.b64encode(SealedBox(pk).encrypt(open(sys.argv[2],'rb').read())).decode())" "$PUB_KEY" "$FILE" 2>/dev/null) || {
              echo "::warning::${NAME}: PyNaCl şifrelemesi başarısız; secret güncellenmedi."
              return 0
            }
            PUT_RESPONSE=$(curl -sS -w '\n%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/${NAME}" \
              -d "{\"encrypted_value\":\"${ENC}\",\"key_id\":\"${KEY_ID}\"}") || {
              echo "::warning::${NAME}: GitHub secret PUT isteği başarısız."
              return 0
            }
            PUT_HTTP="${PUT_RESPONSE##*$'\n'}"
            PUT_JSON="${PUT_RESPONSE%$'\n'*}"
            if [ "$PUT_HTTP" != "201" ] && [ "$PUT_HTTP" != "204" ]; then
              API_MESSAGE=$(printf '%s' "$PUT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("message") or "API error")' 2>/dev/null || printf 'JSON olmayan yanit')
              echo "::warning::${NAME}: GitHub secret PUT HTTP ${PUT_HTTP}: ${API_MESSAGE}. REPO_PAT için repository Secrets write yetkisi gerekli."
              return 0
            fi
            echo "[OK] Secret ${NAME} güncellendi (${SIZE} byte, HTTP ${PUT_HTTP})"
          }

          # Kanal 1 için hem genel hem kanal-özel secret'ları güncelle
          if [ -f cookies.json ]; then
            update_secret "COOKIES_JSON" "cookies.json"
            update_secret "COOKIES_JSON_${CHANNEL_ID}" "cookies.json"
          fi
          if [ -f storage_state.json ]; then
            update_secret "STORAGE_STATE_JSON" "storage_state.json"
            update_secret "STORAGE_STATE_JSON_${CHANNEL_ID}" "storage_state.json"
          fi

      - name: "Kanal Hijyeni (Faz 12.5): Banner + About + Sabitlenmiş Yorum"
        # Gate 'false' dediyse (bekci kosusu) calisma: .env yok -> About metni
        # e-posta olmadan yazilir ve KANAL HAKKINDA alani yanlislikla ezilirdi.
        if: ${{ always() && steps.gate.outputs.produce != 'false' }}
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID || 'UCBZVbwc7s7TeUCcOaN58oHQ' }}
          AFFILIATE_URL_DEFAULT: ${{ vars.AFFILIATE_URL_DEFAULT }}
        run: |
          set -uo pipefail
          mkdir -p logs
          # Banner (bir kerelik) + About metni
          if [ ! -f assets/banner.png ]; then
            python scripts/generate_banner.py --out assets/banner.png || true
          fi
          ABOUT_TEXT="Bu kanal, yapay zeka destekli, her gün yeni şok bilgiler sunan bir arşivdir. İş birlikleri için: $(grep -E '^YT_EMAIL=' .env 2>/dev/null | cut -d= -f2- || echo 'iletisim@kanal.com')"
          # Yeni yayınlanan video varsa sabitlenmiş yorum ekle
          VIDEO_ID=""
          if [ -f logs/channel_video_id.txt ]; then VIDEO_ID=$(cat logs/channel_video_id.txt); fi
          if [ -z "$VIDEO_ID" ] && [ -f logs/auth_status.json ]; then
            VIDEO_ID=$(python3 -c "import json;d=json.load(open('logs/auth_status.json'));print(d.get('videoId') or d.get('video_id') or '')" 2>/dev/null || true)
          fi
          # bash ARRAY: metin degerli argumanlar (e-posta, aciklama) parcalanmaz
          ARGS=(--banner assets/banner.png --about "$ABOUT_TEXT")
          if [ -n "$VIDEO_ID" ]; then ARGS+=(--pin "$VIDEO_ID"); fi
          echo "[*] Kanal hijyeni çalıştırılıyor: ${ARGS[*]}"
          if timeout 600 xvfb-run -a --server-args="-screen 0 1660x950x24" node scripts/channel_hygiene.js "${ARGS[@]}"; then
            echo "[+] Kanal hijyeni BAŞARILI."
          else
            HYGIENE_RC=$?
            echo "::warning::Kanal hijyeni başarısız (rc=${HYGIENE_RC}). Yayınlama etkilenmedi."
          fi

      - name: "Artifact Guvenlik Denetimi (cerez/token redakte)"
        if: always()
        run: bash scripts/sanitize_logs.sh logs

      - name: Üretilen Videoyu ve Logları Yedekle (Artifact - Kanal ${{ matrix.channel_id }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shorts-output-channel-${{ matrix.channel_id }}-${{ github.run_number }}
          path: |
            output/final_short.mp4
            script.json
            logs/
          retention-days: 7

      - name: "Run Durum Özeti (Tek Satır Bildirim)"
        if: always()
        run: python scripts/run_summary.py logs/run_status.json

      - name: "Konu Rezervasyonunu Tamamla veya Serbest Bırak"
        if: ${{ always() && steps.gate.outputs.produce == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOPIC_HISTORY_REF: main
        run: |
          if [ -f .topic_reservations.json ]; then
            python -m scripts.topic_history finalize --commit '${{ steps.orchestrator.outcome == 'success' && 'true' || 'false' }}'
          else
            echo "[INFO] Bu koşuda konu rezervasyonu oluşturulmadı."
          fi

  # ---------------------------------------------------------------------------
  # CRON KILIDI KIRMA: GitHub'ın 'schedule' tetikleyicisi throttle/yok sayılabiliyor.
  # Bu job, zamanlayıcı ölüyse iş akışını kendi kendine yeniden tetikler (workflow_dispatch).
  # ÖNEMLİ: Zincir TEK kanal tetikler (dizi kanal sirasi), "all" DEĞIL.
  # ---------------------------------------------------------------------------
  cron-kick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [channel-map, build-and-upload]
    # IPTAL EDILEN kosu yeni kosu TETIKLEMEZ (iptal firtinasinin koku).
    # onceki davranis: if: always() -> #34 iptal -> #35 dogdu -> #35 iptal -> #36 ...
    if: ${{ !cancelled() }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_CHANNEL: ${{ needs.channel-map.outputs.next_channel }}
      DISTINCT_COUNT: ${{ needs.channel-map.outputs.distinct_count }}
    steps:
      - name: Depoyu Çek (Checkout - pruner tetikleyici betikleri için)
        uses: actions/checkout@v7

      # PRUNER SAATLİK TETİKLEYİCİ (2026-11-07, kullanıcı kararı):
      # GitHub schedule bu repoda çok seyrek çalışıyor (günde ~3). daily_shorts
      # ~14 dk'da bir koştuğu için, son pruner koşusu 55 dk'dan eskiyse ve aktif
      # pruner koşusu yoksa hourly_pruner.yml buradan tetiklenir. Bu adım kendi
      # başına çalışır; aşağıdaki zincir adımının exit 0'larından etkilenmez.
      - name: Pruner Saatlik Zincirini Kontrol Et
        continue-on-error: true
        run: |
          NOW=$(date -u +%s)
          PRUNER="hourly_pruner.yml"
          MIN_GAP=3300
          LAST_PRUNER=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PRUNER}/runs?per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)
          if [ -n "$LAST_PRUNER" ]; then
            LAST_PRUNER_EPOCH=$(date -u -d "$LAST_PRUNER" +%s 2>/dev/null || echo 0)
            PGAP=$(( NOW - LAST_PRUNER_EPOCH ))
            if [ "$PGAP" -lt "$MIN_GAP" ]; then
              echo "[PRUNER] Son pruner ${PGAP}s once (min ${MIN_GAP}s) -> tetiklenmedi."
              exit 0
            fi
          fi
          PACTIVE=$(bash scripts/active_runs_count.sh "${PRUNER}" 2>/dev/null || echo 0)
          PACTIVE="${PACTIVE:-0}"
          if [ "${PACTIVE}" -gt 0 ]; then
            echo "[PRUNER] Aktif pruner kosusu: ${PACTIVE} -> tetiklenmedi."
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${PRUNER}/dispatches" \
            -d '{"ref":"main","inputs":{"target_channel":"1","slot_epoch":""}}'
          echo "[PRUNER] hourly_pruner.yml tetiklendi (son kosu ${PGAP:-?}s once)."

      # DRAFT PUBLISHER 20 DK TETİKLEYİCİ (2026-11-07, kullanıcı kararı):
      # GitHub schedule güvenilmez; son draft_publisher koşusu 19 dk'dan eskiyse ve aktif koşusu
      # yoksa buradan tetiklenir. Kendi başına çalışır, zincir mantığına dokunmaz.
      - name: Draft Publisher 20 dk Zincirini Kontrol Et
        continue-on-error: true
        run: |
          NOW=$(date -u +%s)
          WF="draft_publisher.yml"
          MIN_GAP=1140
          LAST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)
          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
            GAP=$(( NOW - LAST_EPOCH ))
            if [ "$GAP" -lt "$MIN_GAP" ]; then
              echo "[DRAFT] Son draft_publisher ${GAP}s once (min ${MIN_GAP}s) -> tetiklenmedi."
              exit 0
            fi
          fi
          ACTIVE=$(bash scripts/active_runs_count.sh "${WF}" 2>/dev/null || echo 0)
          ACTIVE="${ACTIVE:-0}"
          if [ "${ACTIVE}" -gt 0 ]; then
            echo "[DRAFT] Aktif draft_publisher kosusu: ${ACTIVE} -> tetiklenmedi."
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/dispatches" \
            -d '{"ref":"main","inputs":{"max_per_run":"2","dry_run":"0"}}'
          echo "[DRAFT] draft_publisher.yml tetiklendi (son kosu ${GAP:-?}s once)."

      - name: Zamanlayıcı Sağlığını Kontrol Et ve Zinciri Devam Ettir
        run: |
          NOW=$(date -u +%s)
          WORKFLOW="daily_shorts.yml"

          # --- 1) Onceki turun kotaya takilip takilmadigini kontrol et ---
          QUOTA_HIT=0
          JOB_IDS=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=20" \
            | python3 -c "import json,sys;print(' '.join(str(j['id']) for j in json.load(sys.stdin).get('jobs',[])))" 2>/dev/null || true)
          for J in ${JOB_IDS}; do
            if curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${J}/logs" 2>/dev/null \
                 | grep -qiE "YÜKLEME ATLANDI|yükleme kotanı doldu|kota doldu"; then
              QUOTA_HIT=1
              break
            fi
          done

          if [ "$QUOTA_HIT" = "1" ]; then
            echo "[KOTA] Onceki tur gunluk yukleme kotasiyla durdu -> 4 saat bekleniyor."
            echo "[OK] Zincir TETIKLENMEDI (kota)."
            exit 0
          fi

          # --- 2) Zamanlayici canli mi? ---
          LAST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=schedule&per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)

          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s)
            AGE=$(( NOW - LAST_EPOCH ))
            echo "[BILGI] Son schedule calistirmasi ${AGE} saniye once."
          fi

          # --- 3) AKTIF KOSU KONTROLU ---
          ACTIVE_COUNT=$(bash scripts/active_runs_count.sh "${WORKFLOW}" 2>/dev/null || echo 0)
          ACTIVE_COUNT="${ACTIVE_COUNT:-0}"
          if [ "${ACTIVE_COUNT}" -gt 0 ]; then
            echo "[OK] Aktif kosu sayisi: ${ACTIVE_COUNT} -> zincir TETIKLENMEDI (cakisma onlendi)."
            exit 0
          fi

          # Son run'dan bu yana en az 2 saat (7200 sn) geçmeli (kullanıcı kararı: 2-3 saatte 1 video, döngü fırtınası önlemi)
          LAST_ANY=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)
          if [ -n "$LAST_ANY" ]; then
            LAST_ANY_EPOCH=$(date -u -d "$LAST_ANY" +%s)
            GAP=$(( NOW - LAST_ANY_EPOCH ))
            if [ "$GAP" -lt 7200 ]; then
              echo "[OK] Son run ${GAP} saniye once baslamis (min 7200s / 2 saat) -> zincir TETIKLENMEDI."
              exit 0
            fi
          fi

          # --- 4) Zinciri hemen tetikle (slot_epoch bekleme yok) ---
          TARGET_CHANNEL="${NEXT_CHANNEL:-1}"
          echo "[*] Siradaki kanal: ${TARGET_CHANNEL}"

          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_channel\":\"${TARGET_CHANNEL}\",\"slot_epoch\":\"\",\"chain\":\"1\"}}"
          echo "[*] Zincir tetiklendi -> kanal ${TARGET_CHANNEL}."
