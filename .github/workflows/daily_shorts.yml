name: 15-Minute Blitzkrieg Money Printer

on:
  schedule:
    # FAZ 12: GitHub'ın en az throttle ettiği, asal olmayan dakikalar
    - cron: '0,13,27,41,55 * * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: "Test edilecek tekil kanal ID (ör: 1). Boş/'all' = benzersiz (ayrı hesap) kanallar, teker teker."
        required: false
        default: 'all'
        type: string
      slot_epoch:
        description: "Zincir tetikleyicisi için hedef dilim (epoch saniye). Boşsa hemen başlar."
        required: false
        default: ''
        type: string
      chain:
        description: "1 = zincir (kendi kendini devam ettiren) çalıştırma. Zincir koşuları AYRI concurrency grubundadır; elle/schedule çalıştırmalar zincirin YAYININI iptal etmez."
        required: false
        default: '0'
        type: string
      force_local_thumbnail:
        description: "1 = AI kapak servisini atla, yerel yedek kapak (PIL) ile yayinla (rate-limit yolunun CANLI kaniti)."
        required: false
        default: '0'
        type: string

# FAZ 12: Tıkanan/eski job'ı iptal et, en günceli çalıştır (kuyruk tıkanmasın).
# NOT: zincir (cron-kick) tetiklemesi POST'u tamamladıktan SONRA iptal olur,
# bu yüzden kendi kendini devam ettiren zincir bozulmaz.
concurrency:
  # FAZ 12: Iptal (throttle kacinigi) sadece AYNI grup icinde gecerli.
  # Zincir koşuları 'chain=1' ile AYRI grupta calisir -> zincir, devam eden
  # YAYINI iptal etmez (onceki fazda yayin yarida kesiliyordu).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.chain || '0' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  # ---------------------------------------------------------------------------
  # KANAL HARİTASI: 10 secret'in hepsi aynı YouTube hesabını işaret edebilir.
  # Aynı hesabı işaret eden kanallar ayıklanır (günlük kota 10x harcanmasın).
  # Sadece AYRI hesaplara sahip kanallar üretime girer.
  # ---------------------------------------------------------------------------
  channel-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      distinct_csv: ${{ steps.map.outputs.distinct_csv }}
      next_channel: ${{ steps.map.outputs.next_channel }}
      distinct_count: ${{ steps.map.outputs.distinct_count }}
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: Kanal Benzersizlik Analizi
        id: map
        env:
          C1: ${{ secrets.COOKIES_JSON_1 }}
          S1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          C2: ${{ secrets.COOKIES_JSON_2 }}
          S2: ${{ secrets.STORAGE_STATE_JSON_2 }}
          C3: ${{ secrets.COOKIES_JSON_3 }}
          S3: ${{ secrets.STORAGE_STATE_JSON_3 }}
          C4: ${{ secrets.COOKIES_JSON_4 }}
          S4: ${{ secrets.STORAGE_STATE_JSON_4 }}
          C5: ${{ secrets.COOKIES_JSON_5 }}
          S5: ${{ secrets.STORAGE_STATE_JSON_5 }}
          C6: ${{ secrets.COOKIES_JSON_6 }}
          S6: ${{ secrets.STORAGE_STATE_JSON_6 }}
          C7: ${{ secrets.COOKIES_JSON_7 }}
          S7: ${{ secrets.STORAGE_STATE_JSON_7 }}
          C8: ${{ secrets.COOKIES_JSON_8 }}
          S8: ${{ secrets.STORAGE_STATE_JSON_8 }}
          C9: ${{ secrets.COOKIES_JSON_9 }}
          S9: ${{ secrets.STORAGE_STATE_JSON_9 }}
          C10: ${{ secrets.COOKIES_JSON_10 }}
          S10: ${{ secrets.STORAGE_STATE_JSON_10 }}
        run: |
          bash scripts/channel_map.sh

  build-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: channel-map
    # Studio oturum kilidi: ayni anda tek oturum acilir (cerez/cerez catismasi olmasin)
    concurrency:
      group: studio-upload-lock
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Kanal sirasi: BIR video TAMAMEN (kapak + baslik + hashtag + yayin) bitmeden
      # diger kanal BASLAMAZ. Ayni anda 10 kanal calismaz.
      max-parallel: 1
      matrix:
        # distinct_csv duz stringtir ("1" veya "1,2"); JSON dizi GitHub tarafindan
        # secret sanilip maskelenir. split() dizi verir, join() dizi bekler.
        channel_id: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_channel != '' && inputs.target_channel != 'all') && fromJSON(format('["{0}"]', inputs.target_channel)) || fromJSON(format('["{0}"]', join(needs.channel-map.outputs.distinct_csv, '","'))) }}

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: "Uretim Kapisi (Watchdog: Zincir aktifse bu kosu bekci)"
        id: gate
        run: |
          PRODUCE=$(bash scripts/production_gate.sh "${{ github.event_name }}")
          echo "produce=${PRODUCE}" >> "$GITHUB_OUTPUT"
          echo "[GATE] produce=${PRODUCE}"

      - name: APT Paket Arşivi Cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-cache/archives
          key: apt-debs-ubuntu-24.04-${{ hashFiles('.github/workflows/daily_shorts.yml') }}
          restore-keys: |
            apt-debs-ubuntu-24.04-

      - name: APT Cache Dizinini Hazırla
        run: |
          mkdir -p "${RUNNER_TEMP}/apt-cache/archives/partial"
          printf 'Dir::Cache::archives "%s/apt-cache/archives/";\n' "${RUNNER_TEMP}" > "${RUNNER_TEMP}/apt-cache/apt.conf"
          echo "APT_CONFIG=${RUNNER_TEMP}/apt-cache/apt.conf" >> "$GITHUB_ENV"
          echo "[CACHE] APT .deb arşivleri cache dizinine yönlendirildi."

      - name: Sistem Paketlerini Kur (FFmpeg, Fontlar & Xvfb Sanal Ekran)
        timeout-minutes: 5
        run: |
          # Ubuntu 24.04 runner'da ffmpeg genellikle önceden kurulu — kontrol et
          if command -v ffmpeg &>/dev/null && command -v Xvfb &>/dev/null; then
            echo "[✓] ffmpeg $(ffmpeg -version 2>&1 | head -1) — zaten kurulu, apt atlanıyor."
          else
            echo "[↓] Eksik paketler kuruluyor..."
            timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
            timeout 180 sudo apt-get install -y --no-install-recommends \
              ffmpeg xvfb fonts-liberation fonts-dejavu-core libass9
            echo "[✓] Kurulum tamamlandı."
          fi
          # Fontconfig cache'i yenile (Montserrat yoksa sessizce atla)
          fc-cache -f 2>/dev/null || true

      - name: Python 3.11 Kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Node.js 20 Kur
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium Cache Yükle
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Node & Playwright Tarayıcısını Yükle
        run: |
          export APT_CONFIG="${RUNNER_TEMP}/apt-cache/apt.conf"
          npm install
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "[✓] Playwright Chromium cache'den yüklendi, sistem deps kuruluyor..."
            npx playwright install-deps chromium
          else
            echo "[↓] Playwright Chromium indiriliyor + sistem deps..."
            npx playwright install --with-deps chromium
          fi

      - name: Gizli Anahtarları ve Kanal Çerezlerini Enjekte Et (Kanal ${{ matrix.channel_id }})
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          CHANNEL_ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', matrix.channel_id)] }}
          CHANNEL_COOKIES_JSON: ${{ secrets[format('COOKIES_JSON_{0}', matrix.channel_id)] }}
          CHANNEL_STORAGE_STATE_JSON: ${{ secrets[format('STORAGE_STATE_JSON_{0}', matrix.channel_id)] }}
          FALLBACK_ENV_FILE: ${{ secrets.ENV_FILE }}
          FALLBACK_COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          FALLBACK_STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          MEDIA_COOKIES_JSON: ${{ secrets.MEDIA_COOKIES_JSON }}
        run: |
          umask 077
          EFFECTIVE_ENV="${CHANNEL_ENV_FILE:-$FALLBACK_ENV_FILE}"
          EFFECTIVE_COOKIES="${CHANNEL_COOKIES_JSON:-$FALLBACK_COOKIES_JSON}"
          EFFECTIVE_STATE="${CHANNEL_STORAGE_STATE_JSON:-$FALLBACK_STORAGE_STATE_JSON}"

          if [ -z "$EFFECTIVE_ENV" ] || [ -z "$EFFECTIVE_COOKIES" ]; then
            echo "::error::Kanal ${{ matrix.channel_id }} için ENV_FILE_${{ matrix.channel_id }} veya COOKIES_JSON_${{ matrix.channel_id }} eksik!"
            exit 1
          fi

          # printf '%s\n' form: format string sabittir, değişken argüman olarak geçer (format injection yok)
          printf '%s\n' "$EFFECTIVE_ENV" > .env
          printf '\nMATRIX_CHANNEL_ID=%s\n' "${{ matrix.channel_id }}" >> .env
          printf '%s\n' "$EFFECTIVE_COOKIES" > cookies.json
          if [ -n "$EFFECTIVE_STATE" ]; then
            printf '%s\n' "$EFFECTIVE_STATE" > storage_state.json
          fi

          # Pixabay/Pexels cookie'lerini cookies.json'a birleştir (video çekici için)
          if [ -n "$MEDIA_COOKIES_JSON" ]; then
            python3 -c "import json,os; yt=json.load(open('cookies.json')); media=json.loads(os.environ['MEDIA_COOKIES_JSON']); ex={(c['name'],c['domain'])for c in yt}; merged=yt+[c for c in media if(c['name'],c['domain'])not in ex]; json.dump(merged,open('cookies.json','w')); print(f'[OK] Cookie birleştirildi: YouTube+{len(merged)-len(yt)} Media={len(merged)} toplam')"
          fi

          python -c "import json; c=json.load(open('cookies.json')); print(f'[OK] Kanal ${{ matrix.channel_id }} cookies.json doğrulandı ({len(c)} çerez)')"

      - name: Run Orchestrator (Main Pipeline)
        if: ${{ steps.gate.outputs.produce == 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          MATRIX_CHANNEL_ID: ${{ matrix.channel_id }}
          FORCE_LOCAL_THUMBNAIL: ${{ inputs.force_local_thumbnail || '0' }}
          SKIP_THUMBNAIL: ${{ vars.SKIP_THUMBNAIL || '0' }}
          # Yalnız serbest kota için ayrılmış ve faturalandırması KAPALI proje.
          # Projeye ödeme bağlanırsa vars.GEMINI_FREE_VISION_ENABLED değerini hemen 0 yapın.
          GEMINI_FREE_VISION_ENABLED: ${{ vars.GEMINI_FREE_VISION_ENABLED || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Tek video: icerik -> ses -> video -> kapak -> baslik/hashtag -> YAYIN (PUBLIC)
          # Tamami bitmeden sonraki kanal/kullanici devreye girmez (max-parallel: 1).
          xvfb-run -a --server-args="-screen 0 1366x900x24" python main.py --channel_id ${{ matrix.channel_id }}

      - name: "Kanal Hijyeni (Faz 12.5): Banner + About + Sabitlenmiş Yorum"
        # Gate 'false' dediyse (bekci kosusu) calisma: .env yok -> About metni
        # e-posta olmadan yazilir ve KANAL HAKKINDA alani yanlislikla ezilirdi.
        if: ${{ always() && steps.gate.outputs.produce != 'false' }}
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID || 'UCBZVbwc7s7TeUCcOaN58oHQ' }}
          AFFILIATE_URL_DEFAULT: ${{ vars.AFFILIATE_URL_DEFAULT }}
        run: |
          set -uo pipefail
          mkdir -p logs
          # Banner (bir kerelik) + About metni
          if [ ! -f assets/banner.png ]; then
            python scripts/generate_banner.py --out assets/banner.png || true
          fi
          ABOUT_TEXT="Bu kanal, yapay zeka destekli, her gün yeni şok bilgiler sunan bir arşivdir. İş birlikleri için: $(grep -E '^YT_EMAIL=' .env 2>/dev/null | cut -d= -f2- || echo 'iletisim@kanal.com')"
          # Yeni yayınlanan video varsa sabitlenmiş yorum ekle
          VIDEO_ID=""
          if [ -f logs/channel_video_id.txt ]; then VIDEO_ID=$(cat logs/channel_video_id.txt); fi
          if [ -z "$VIDEO_ID" ] && [ -f logs/auth_status.json ]; then
            VIDEO_ID=$(python3 -c "import json;d=json.load(open('logs/auth_status.json'));print(d.get('videoId') or d.get('video_id') or '')" 2>/dev/null || true)
          fi
          # bash ARRAY: metin degerli argumanlar (e-posta, aciklama) parcalanmaz
          ARGS=(--banner assets/banner.png --about "$ABOUT_TEXT")
          if [ -n "$VIDEO_ID" ]; then ARGS+=(--pin "$VIDEO_ID"); fi
          echo "[*] Kanal hijyeni çalıştırılıyor: ${ARGS[*]}"
          if timeout 600 xvfb-run -a --server-args="-screen 0 1660x950x24" node scripts/channel_hygiene.js "${ARGS[@]}"; then
            echo "[+] Kanal hijyeni BAŞARILI."
          else
            HYGIENE_RC=$?
            echo "::warning::Kanal hijyeni başarısız (rc=${HYGIENE_RC}). Yayınlama etkilenmedi."
          fi

      - name: "Artifact Guvenlik Denetimi (cerez/token redakte)"
        if: always()
        run: bash scripts/sanitize_logs.sh logs

      - name: Üretilen Videoyu ve Logları Yedekle (Artifact - Kanal ${{ matrix.channel_id }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shorts-output-channel-${{ matrix.channel_id }}-${{ github.run_number }}
          path: |
            output/final_short.mp4
            script.json
            logs/
          retention-days: 7

      - name: "Run Durum Özeti (Tek Satır Bildirim)"
        if: always()
        run: python scripts/run_summary.py logs/run_status.json

      - name: "Konu Geçmişini Repoya Kaydet (.used_topics.json persist)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .used_topics.json varsa ve içerik değiştiyse repoya commit et
          if [ ! -f ".used_topics.json" ]; then
            echo "[*] .used_topics.json yok, atlanıyor."
            exit 0
          fi
          CONTENT=$(cat .used_topics.json)
          ENCODED=$(python3 -c "import base64,sys; print(base64.b64encode(sys.stdin.buffer.read()).decode())" < .used_topics.json)
          # Mevcut SHA'yı al
          EXISTING=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.used_topics.json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          # Commit payload
          if [ -n "$EXISTING" ]; then
            PAYLOAD="{\"message\":\"chore: konu geçmişi güncellendi [skip ci]\",\"content\":\"${ENCODED}\",\"sha\":\"${EXISTING}\"}"
          else
            PAYLOAD="{\"message\":\"chore: konu geçmişi oluşturuldu [skip ci]\",\"content\":\"${ENCODED}\"}"
          fi
          RESULT=$(curl -s -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.used_topics.json" \
            -d "$PAYLOAD")
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('[OK] .used_topics.json repoya kaydedildi.') if 'content' in d else print('[WARN] Kaydetme:', str(d)[:120])" || echo "[WARN] JSON parse hatası"

  # ---------------------------------------------------------------------------
  # CRON KILIDI KIRMA: GitHub'ın 'schedule' tetikleyicisi throttle/yok sayılabiliyor.
  # Bu job, zamanlayıcı ölüyse iş akışını kendi kendine yeniden tetikler (workflow_dispatch).
  # ÖNEMLİ: Zincir TEK kanal tetikler (dizi kanal sirasi), "all" DEĞIL.
  # ---------------------------------------------------------------------------
  cron-kick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [channel-map, build-and-upload]
    # IPTAL EDILEN kosu yeni kosu TETIKLEMEZ (iptal firtinasinin koku).
    # onceki davranis: if: always() -> #34 iptal -> #35 dogdu -> #35 iptal -> #36 ...
    if: ${{ !cancelled() }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_CHANNEL: ${{ needs.channel-map.outputs.next_channel }}
      DISTINCT_COUNT: ${{ needs.channel-map.outputs.distinct_count }}
    steps:
      - name: Zamanlayıcı Sağlığını Kontrol Et ve Zinciri Devam Ettir
        run: |
          NOW=$(date -u +%s)
          WORKFLOW="daily_shorts.yml"

          # --- 1) Onceki turun kotaya takilip takilmadigini kontrol et ---
          QUOTA_HIT=0
          JOB_IDS=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=20" \
            | python3 -c "import json,sys;print(' '.join(str(j['id']) for j in json.load(sys.stdin).get('jobs',[])))" 2>/dev/null || true)
          for J in ${JOB_IDS}; do
            if curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${J}/logs" 2>/dev/null \
                 | grep -qiE "YÜKLEME ATLANDI|yükleme kotanı doldu|kota doldu"; then
              QUOTA_HIT=1
              break
            fi
          done

          if [ "$QUOTA_HIT" = "1" ]; then
            echo "[KOTA] Onceki tur gunluk yukleme kotasiyla durdu -> 4 saat bekleniyor."
            echo "[OK] Zincir TETIKLENMEDI (kota)."
            exit 0
          fi

          # --- 2) Zamanlayici canli mi? ---
          LAST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=schedule&per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)

          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s)
            AGE=$(( NOW - LAST_EPOCH ))
            echo "[BILGI] Son schedule calistirmasi ${AGE} saniye once."
          fi

          # --- 3) AKTIF KOSU KONTROLU ---
          ACTIVE_COUNT=$(bash scripts/active_runs_count.sh "${WORKFLOW}" 2>/dev/null || echo 0)
          ACTIVE_COUNT="${ACTIVE_COUNT:-0}"
          if [ "${ACTIVE_COUNT}" -gt 0 ]; then
            echo "[OK] Aktif kosu sayisi: ${ACTIVE_COUNT} -> zincir TETIKLENMEDI (cakisma onlendi)."
            exit 0
          fi

          # Son run'dan bu yana en az 3 dakika geçmeli (döngü fırtınası önlemi)
          LAST_ANY=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('workflow_runs') or [];print(r[0]['created_at'] if r else '')" 2>/dev/null || true)
          if [ -n "$LAST_ANY" ]; then
            LAST_ANY_EPOCH=$(date -u -d "$LAST_ANY" +%s)
            GAP=$(( NOW - LAST_ANY_EPOCH ))
            if [ "$GAP" -lt 180 ]; then
              echo "[OK] Son run ${GAP} saniye once baslamis (min 180s) -> zincir TETIKLENMEDI."
              exit 0
            fi
          fi

          # --- 4) Zinciri hemen tetikle (slot_epoch bekleme yok) ---
          TARGET_CHANNEL="${NEXT_CHANNEL:-1}"
          echo "[*] Siradaki kanal: ${TARGET_CHANNEL}"

          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_channel\":\"${TARGET_CHANNEL}\",\"slot_epoch\":\"\",\"chain\":\"1\"}}"
          echo "[*] Zincir tetiklendi -> kanal ${TARGET_CHANNEL}."
