name: "Gemini Web text dry run (cookie session, no publication)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install isolated probe dependencies
        run: python -m pip install --no-cache-dir 'requests==2.34.2' 'gemini_webapi' 'httpx'
      - name: One Gemini Web text call (no publication)
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_COOK:-}" ]; then
            echo "::error::GEMINI_COOK secret is missing."
            exit 1
          fi
          umask 077
          python scripts/gemini_web_text_probe.py --output text_probe_result.json
      - name: Save dry-run result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-text-dry-run
          path: text_probe_result.json
          if-no-files-found: warn
          retention-days: 7
