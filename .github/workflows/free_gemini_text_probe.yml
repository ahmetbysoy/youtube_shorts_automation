name: "Gemini Web text dry run (cookie session, no publication)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Araçları Kur (Python + bağımlılıklar)
        uses: ./.github/actions/setup-tools
        with:
          python: 'true'
          python_version: '3.11'
          pip_requirements: ''
          pip_extra: 'requests==2.34.2 jsonschema>=4.23,<5 gemini_webapi==2.1.1 httpx'
      - name: One Gemini Web text call (no publication)
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          GEMINI_COOK_CONTEXT_PRESENT: ${{ secrets.GEMINI_COOK != '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          # Presence-only diagnostic: never print or measure the cookie value.
          echo "GEMINI_COOK_CONTEXT_PRESENT=${GEMINI_COOK_CONTEXT_PRESENT}"
          if [ -z "${GEMINI_COOK:-}" ]; then
            echo "::error::GEMINI_COOK secret is missing."
            exit 1
          fi
          umask 077
          python scripts/gemini_web_text_probe.py --output text_probe_result.json
      - name: Save dry-run result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-text-dry-run
          path: text_probe_result.json
          if-no-files-found: warn
          retention-days: 7
