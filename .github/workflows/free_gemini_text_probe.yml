name: "Gemini Web text dry run (cookie session, no publication)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Araçları Kur (Python + bağımlılıklar)
        uses: ./.github/actions/setup-tools
        with:
          python: 'true'
          python_version: '3.11'
          pip_requirements: ''
          pip_extra: 'requests==2.34.2 jsonschema>=4.23,<5 gemini_webapi==2.1.1 httpx playwright'
          playwright_chromium: 'true'
          python_playwright: 'true'
      - name: Chromium kur (Python)
        run: python3 -m playwright install chromium
      - name: One Gemini Web text call (no publication)
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          GEMINI_COOK_CONTEXT_PRESENT: ${{ secrets.GEMINI_COOK != '' }}
          STORAGE_STATE_JSON_1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          # Presence-only diagnostic: never print or measure the cookie value.
          echo "GEMINI_COOK_CONTEXT_PRESENT=${GEMINI_COOK_CONTEXT_PRESENT}"
          if [ -z "${GEMINI_COOK:-}" ]; then
            echo "::error::GEMINI_COOK secret is missing."
            exit 1
          fi
          umask 077
          # PW metin adapter tam Google oturumu kullanir (yalnizca PSID/PSIDTS
          # gemini.google.com'da oturum acmaya yetmez — run 45016613754 kaniti).
          if [ -n "${STORAGE_STATE_JSON_1}" ]; then
            printf '%s' "$STORAGE_STATE_JSON_1" > storage_state.json
          elif [ -n "${STORAGE_STATE_JSON}" ]; then
            printf '%s' "$STORAGE_STATE_JSON" > storage_state.json
          elif [ -n "${COOKIES_JSON_1}" ]; then
            printf '%s' "$COOKIES_JSON_1" > cookies.json
          elif [ -n "${COOKIES_JSON}" ]; then
            printf '%s' "$COOKIES_JSON" > cookies.json
          fi
          if [ -f storage_state.json ]; then
            echo "storage_state.json yazildi ($(wc -c < storage_state.json) byte)"
          elif [ -f cookies.json ]; then
            echo "cookies.json yazildi ($(wc -c < cookies.json) byte)"
          fi
          python scripts/gemini_web_text_probe.py --output text_probe_result.json || \
            echo "::warning::tam probe basarisiz (Wikipedia rate-limit/validasyon olabilir) — tasima-yalniz test yine de kosulacak"
          # Tasima-yalniz test: konu secimi/Wikipedia olmadan PW adapter'in
          # oturum+gonderim+extraction zincirini sabit mini prompt ile dogrular.
          printf 'Sadece su JSON u yanitla, baska hicbir metin ekleme:\n{"topic":"transport-test","title":"PW Transport Testi","script_text":"Bu bir tasima testidir.","visual_keywords":["test","bir","iki","uc"]}\n' > /tmp/transport_prompt.txt
          TRANSPORT_OK=0
          if python scripts/gemini_story_pw.py --prompt-file /tmp/transport_prompt.txt --out /tmp/transport_resp.txt --timeout 120; then
            echo "TRANSPORT_OK(PW)"
            echo "yanit_boyutu=$(wc -c < /tmp/transport_resp.txt) byte"
            TRANSPORT_OK=1
          else
            echo "TRANSPORT_FAIL(PW)"
          fi
          if [ "$TRANSPORT_OK" != "1" ]; then
            echo "::error::PW metin tasima testi basarisiz."
            exit 1
          fi
      - name: Save dry-run result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-text-dry-run
          path: text_probe_result.json
          if-no-files-found: warn
          retention-days: 7
