name: "00 — Secret Sağlık Kontrolü (TÜM SECRETS)"
run-name: "Secret health-check"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO_PAT: ${{ secrets.REPO_PAT }}
      GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
      PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
      PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
      YT_COOKIES: ${{ secrets.COOKIES_JSON || secrets.COOKIES_JSON_1 }}
      YT_STORAGE: ${{ secrets.STORAGE_STATE_JSON || secrets.STORAGE_STATE_JSON_1 }}
      YT_EMAIL: ${{ secrets.YT_EMAIL }}
      YT_PASSWORD: ${{ secrets.YT_PASSWORD }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MEDIA_CK: ${{ secrets.MEDIA_COOKIES_JSON }}
      DRAFT_COOK: ${{ secrets.COOKIES_JSON_DRAFT }}
      DRAFT_SS: ${{ secrets.STORAGE_STATE_JSON_DRAFT }}
    steps:
      - uses: actions/checkout@v7
      - name: Araçlar
        uses: ./.github/actions/setup-tools
        with:
          apt_packages: ffmpeg
          python: 'true'
          python_version: '3.11'
          node: 'false'
          python_playwright: 'false'
          pip_requirements: ''
          pip_extra: 'requests pynacl gemini_webapi'
      - name: Secret sağlık kontrolünü çalıştır
        run: python3 scripts/secret_health_check.py
