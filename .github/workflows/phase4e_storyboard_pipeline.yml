name: Faz 4E — Cookie-only storyboard medya hattı kanıtı (yayınsız)

# Bu workflow gercek medya zincirini kanıtlar:
#   1) Test storyboard JSON olusturur
#   2) select_storyboard_media ile Pexels+Pixabay cookie-only saglayicilari cagirir
#   3) Gercek video indirir (ffmpeg tam decode)
#   4) Manifest, lisans, atif, sahne raporu uretir
#   5) Consumer FFmpeg hattini calistirip test videosu olusturur
#   6) YouTube'a hicbir yukleme/yayin/silme YAPMAZ.

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Birinci sahne arama kelimesi (orn. cat)"
        required: false
        default: "cat"
      keyword2:
        description: "Ikinci sahne arama kelimesi (orn. dog) — duplicate_onle"
        required: false
        default: "dog"
      scenes:
        description: "Kac sahne (1-3)"
        required: false
        default: "2"
  # Manuel push ile de tetiklenebilir ama otomatik cron YOK (gunluk uretim tetiklenmez)

permissions:
  contents: read

jobs:
  storyboard-cookie-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Araçları Kur (FFmpeg + Python + Node + Playwright Chromium)
        uses: ./.github/actions/setup-tools
        with:
          apt_packages: ffmpeg libass9 fonts-liberation fonts-dejavu-core
          python: 'true'
          python_version: '3.11'
          pip_requirements: |
            requirements.txt
            requirements-test.txt
          node: 'true'
          node_version: '20'
          node_playwright: 'true'
          playwright_chromium: 'true'
          playwright_with_deps: 'false'
          python_playwright: 'true'
          node_check: 'video_fetcher.js analytics_scraper.js'

      - name: Playwright binary teyidi
        run: ls -la ~/.cache/ms-playwright/

      - name: Cookie preflight (PEXELS_COOK/PIXABAY_COOK var/yok + domain)
        id: preflight
        env:
          PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
          PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {}
          for provider, env_name, expected_domain in (
              ("pexels", "PEXELS_COOK", ".pexels.com"),
              ("pixabay", "PIXABAY_COOK", ".pixabay.com")):
              raw = os.environ.get(env_name, "")
              present = bool(raw and raw.strip())
              count = 0
              domain_ok = False
              fmt = None
              sample_names = []
              if present:
                  # JSON dizi / storage_state / "k=v; k=v" formatlarini guvenli sekilde say
                  s = raw.strip()
                  try:
                      data = json.loads(s)
                      fmt = "json"
                      cookies = data.get("cookies", data) if isinstance(data, dict) else data
                      count = len(cookies)
                      # Cookie domain ".pixabay.com" veya "pixabay.com" veya "www.pixabay.com" olabilir
                      # JS tarafindaki filtre ile ayni: d === defaultDomain || d.endsWith(defaultDomain)
                      def dom_ok(c_domain, expected):
                          cd = str(c_domain or expected)
                          if not cd.startswith("."):
                              cd = "." + cd
                          return cd == expected or cd.endswith(expected)
                      domain_ok = all(dom_ok(c.get("domain"), expected_domain) for c in cookies)
                      sample_names = [str(c.get("name","")) for c in cookies[:3]]
                  except Exception:
                      if "=" in s:
                          fmt = "kv"
                          cookies = [kv.strip() for kv in s.split(";") if "=" in kv]
                          count = len(cookies)
                          domain_ok = True  # cookie string, domain filtresi JS tarafinda
                          sample_names = [c.split("=",1)[0] for c in cookies[:3]]
              results[provider] = {
                  "present": present, "length": len(raw), "format": fmt,
                  "cookie_count": count, "domain_ok": domain_ok,
                  "sample_names": sample_names
              }
              print(f"[{provider}] present={present} format={fmt} count={count} domain_ok={domain_ok}")
              print(f"    sample names: {sample_names}")
          if not results["pexels"]["present"] or not results["pixabay"]["present"]:
              print("HATA: PEXELS_COOK veya PIXABAY_COOK secret'i yok")
              sys.exit(2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("preflight=" + json.dumps(results) + "\n")
          PY

      - name: Cookie-only storyboard medya secimi (indirme+ffprobe+decode+manifest+atik)
        id: storyboard
        env:
          PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
          PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
          # YouTube / Gemini / GITHUB token'lari KASITEN gecmiyoruz — medya hattinin bunlar
          # olmadan da calistigini kanitlamak icin child env yalnizca bu cookie'leri icerir.
          MEDIA_COOKIES_JSON: ""
          YOUTUBE_COOKIES: ""
          GEMINI_COOK: ""
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          mkdir -p phase4e_out
          python3 - <<'PY'
          import json, os, sys, subprocess, tempfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from src.media_processing.scene_media import select_storyboard_media
          from src.media_processing.media_history import MediaHistory

          keyword1 = "${{ inputs.keyword }}"
          keyword2 = "${{ inputs.keyword2 }}"
          scenes_n = int("${{ inputs.scenes }}")
          # Her sahne icin farkli anahtar kelime kullan (ayni kelime tekrarinda
          # Pexels/Pixabay ayni videolari dondurdugunde duplicate_in_video eler)
          kw_per_scene = [keyword1, keyword2, f"{keyword1} nature",
                          f"{keyword1} close up", f"{keyword2} close up"]
          scene_duration = 6.0
          total_dur = scene_duration * scenes_n
          script = {
              "generation_id": "phase4e_probe_" + os.urandom(4).hex(),
              "title": f"Faz4E Test - {keyword1}+{keyword2}",
              "audio_duration_sec": total_dur,
              "storyboard": [
                  {"scene_id": i+1,
                   "visual_query": (kw := kw_per_scene[i % len(kw_per_scene)]),
                   # narration her zaman visual_query kelimesini ICMELI (terms alignment)
                   "narration": f"{kw} stock video footage showing real {kw} scenes",
                   "media_type": "video"}
                  for i in range(scenes_n)
              ]
          }
          out_dir = Path("phase4e_out")
          out_dir.mkdir(parents=True, exist_ok=True)
          # Local atomic history — remote GitHub Contents API kullanmiyoruz (yayinsiz test)
          hist_path = out_dir/"history"/".media_history.json"
          hist_path.parent.mkdir(parents=True, exist_ok=True)
          if not hist_path.exists():
              hist_path.write_text('{"version":1,"entries":[]}\n', "utf8")
          report_file = out_dir/"storyboard_report.json"
          try:
              runtime_clips, summary = select_storyboard_media(
                  script, out_dir,
                  history=MediaHistory(path=hist_path),
                  report_path=report_file,
              )
          except Exception as exc:
              import traceback
              print(f"\n[EXC] {type(exc).__name__}: {str(exc)[:400]}")
              # SceneMediaError .args[1] rapor dict'ini tasir; oradan doğrudan oku
              rep = None
              if exc.args and len(exc.args) >= 2 and isinstance(exc.args[1], dict):
                  rep = exc.args[1]
              if rep is None:
                  rp = out_dir/"storyboard_report.json"
                  if rp.exists():
                      try:
                          rep = json.loads(rp.read_text("utf8"))
                      except Exception:
                          rep = None
              if rep is None:
                  rep = {"status": "failed", "failure": str(exc)[:300], "scenes": []}
              print(f"failure: {rep.get('failure')}")
              for s in rep.get("scenes", []):
                  print(f"  scene {s.get('scene_id')}: selected_provider={s.get('selected_provider')} "
                        f"rejection_reason={s.get('rejection_reason')}")
                  for pe in s.get("provider_errors", [])[:5]:
                      print(f"    provider_error: provider={pe.get('provider')} error={pe.get('error_type')}")
                  for rj in s.get("rejections", [])[:3]:
                      print(f"    rejection: {rj.get('key')} reasons={rj.get('reasons') or rj.get('rejection_reasons')}")
              # Raporu artifact icin yaz
              (out_dir/"storyboard_report.json").write_text(json.dumps(rep, indent=2, ensure_ascii=False), "utf8")
              traceback.print_exc()
              print("HATA: medya secimi basarisiz (yukarida diagnostics)")
              sys.exit(3)
          print("\n=== SELECT_STORYBOARD_MEDIA OZET ===")
          print(f"status={summary.get('status')}, scenes={len(summary.get('scenes', []))}")
          for s in summary.get("scenes", []):
              print(f"  scene {s.get('scene_id')}: provider={s.get('selected_provider')} "
                    f"media_id={s.get('selected_media_id')} source={s.get('source_url')} "
                    f"license={s.get('license')} attribution={s.get('attribution')} "
                    f"duration={s.get('duration')} res={s.get('resolution')}")
              # Her sahne icin provider_errors / rejections ozet
              perr = [e.get("error_type") for e in s.get("provider_errors", [])]
              if perr:
                  print(f"    provider_errors: {perr}")
          # Raporu JSON olarak artifact'e yaz (URL query'siz)
          def clean_url(u):
              try:
                  from urllib.parse import urlsplit
                  sp = urlsplit(u)
                  return f"{sp.scheme}://{sp.netloc}{sp.path}" if u else None
              except:
                  return u
          safe_summary = json.loads(json.dumps(summary, default=str))
          for s in safe_summary.get("scenes", []):
              if s.get("source_url"): s["source_url"] = clean_url(s["source_url"])
              for r in s.get("rejections", []):
                  if r.get("source_url"): r["source_url"] = clean_url(r["source_url"])
              for m in s.get("measured_candidates", []):
                  m_url = (m.get("media") or {}).get("download_url") or (m.get("media") or {}).get("source_url")
                  if m_url:
                      (m.get("media") or {})["download_url"] = clean_url(m_url)
          (out_dir/"storyboard_report.json").write_text(json.dumps(safe_summary, indent=2, ensure_ascii=False), "utf8")
          # Fail-check: her sahneye medya secilmis mi?
          missing = [s["scene_id"] for s in summary.get("scenes",[]) if not s.get("selected_provider")]
          if missing:
              print(f"HATA: sahneler secilemedi: {missing}")
              sys.exit(3)
          # Cookie-only kaniti: her secilen medya icin transport/auth bilgisini kontrol et.
          # - Pexels/Pixabay secilmis ISE catalog_transport kesinlikle "playwright" olmali
          #   (BrowserStockProvider, cookie ile). "api" olmasi API-key'li saglayiciya
          #   dustugunu gosterir — bu cookie-only testte KESIN HATA.
          # - Wikimedia her zaman "api" transport kullanir (Wikimedia REST API, ucretsiz
          #   public API, API-key gerektirmez); bu normal ve beklenen fallback'tir.
          stock_api_used = False
          transport_breakdown = {}
          for s in summary.get("scenes", []):
              prov = s.get("selected_provider")
              ct = (s.get("media") or {}).get("catalog_transport", "unknown")
              transport_breakdown[f"{prov}/{ct}"] = transport_breakdown.get(f"{prov}/{ct}", 0) + 1
              if prov in ("pexels", "pixabay") and ct != "playwright":
                  stock_api_used = True
                  print(f"  HATA: scene {s.get('scene_id')} provider={prov} catalog_transport={ct} "
                        f"(cookie-only testte 'playwright' olmasi gerekiyordu)")
          print(f"transport_dagilimi={transport_breakdown}")
          print(f"pexels_pixabay_api_kullanimi={stock_api_used}")
          if stock_api_used:
              print("HATA: Pexels/Pixabay API-key ile erisildi; cookie-only dogrulamasi basarisiz.")
              sys.exit(5)
          # Wikimedia kullanildi mi?
          wm = sum(1 for s in summary.get("scenes",[]) if s.get("selected_provider") == "wikimedia")
          print(f"wikimedia_fallback_scenes={wm}")
          # Atif kontrolu
          missing_attr = [s["scene_id"] for s in summary.get("scenes",[]) if not s.get("attribution")]
          print(f"missing_attribution_scenes={missing_attr}")
          PY

      - name: Consumer FFmpeg hattini test et (kucuk montaj)
        run: |
          set -euo pipefail
          # Gercek secilmis .mp4 dosyalarini alip kisa bir montaj yap (gercek FFmpeg consumer smoke)
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path("phase4e_out/storyboard_report.json").read_text("utf8"))
          files = []
          for s in report["scenes"]:
              cand_dir = Path("phase4e_out")
              # Dosyalar scene_<sid>_<n>.mp4 olarak bulunur; secileni bulmak icin dizini tara
              matches = sorted(cand_dir.glob(f"scene_{s['scene_id']}_*.mp4"))
              if matches:
                  files.append(matches[0])
          if not files:
              print("HATA: hicbir secilmis mp4 bulunamadi")
              raise SystemExit(4)
          # ffconcat olustur (her dosyayi en fazla 3 sn)
          cl = Path("phase4e_out/concat.txt")
          with cl.open("w") as f:
              for fp in files:
                  f.write(f"file '{fp.resolve()}'\n")
          out = Path("phase4e_out/final_probe.mp4")
          # ffprobe ile dosyalarin cozunurluk/sure/codec dogrula
          for fp in files:
              r = subprocess.run(["ffprobe","-v","error","-print_format","json","-show_streams",str(fp)], capture_output=True, text=True, timeout=30)
              info = json.loads(r.stdout)
              v = next((x for x in info.get("streams",[]) if x.get("codec_type")=="video"), {})
              print(f"  {fp.name}: {v.get('width')}x{v.get('height')} codec={v.get('codec_name')}")
              assert v.get("codec_name") in ("h264","hevc","vp9"), f"codec gecersiz: {v.get('codec_name')}"
          # Concat ile montaj
          subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(cl),
                          "-c:v","libx264","-preset","ultrafast","-an","-t","20",
                          str(out)], check=True, capture_output=True, timeout=60)
          assert out.exists() and out.stat().st_size > 50000, "final_probe.mp4 olusmadi"
          # Tam decode
          fd = subprocess.run(["ffmpeg","-v","error","-i",str(out),"-f","null","-"], capture_output=True, timeout=60)
          assert fd.returncode == 0, f"final decode hatasi: {fd.stderr.decode()[:300]}"
          print(f"✅ Final montaj: {out.stat().st_size/1024/1024:.2f} MB, tam decode OK")
          PY

      - name: Nihai ozet (kanıt)
        run: |
          echo "### Faz 4E Cookie-only medya hatti kaniti" >> "$GITHUB_STEP_SUMMARY"
          echo "Pexels ve Pixabay saglayicilari cookie-only olarak cagrildi; API endpoint'leri hic cagrilmadi." >> "$GITHUB_STEP_SUMMARY"
          ls -la phase4e_out/
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/phase4e_summary.py phase4e_out/storyboard_report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact (sansurlu JSON + stderr; video YOK, cookie YOK)
        uses: actions/upload-artifact@v4
        with:
          name: phase4e-storyboard-evidence
          path: |
            phase4e_out/storyboard_report.json
          # video dosyalari artifact'e koymuyoruz (gizlilik ve boyut)

      - name: Video dosyalarini temizle (artifact'te olmasin)
        if: always()
        run: |
          rm -f phase4e_out/*.mp4 phase4e_out/*.part phase4e_out/concat.txt
