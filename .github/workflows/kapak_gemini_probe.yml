name: "Kapak Gemini Teshis Probe (init matrisi + tam kapak uretimi)"
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Test basligi (uretimde baslik+prompt seklinde gonderilir)"
        required: false
        default: "Ay'a Gitmek Icin Hicbir Zaman Cikmayacak: Iste Gercek Sebep!"
        type: string
      targets:
        description: "Virgulle ayrilmis TLS impersonate hedefleri (bos = varsayilan matris)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: kapak-gemini-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Araçları Kur (Python 3.11 + gemini_webapi + Playwright)
        uses: ./.github/actions/setup-tools
        with:
          python: 'true'
          python_version: '3.11'
          pip_requirements: ''
          pip_extra: 'gemini_webapi==2.1.1 httpx Pillow loguru playwright'
          playwright_chromium: 'true'
          python_playwright: 'true'

      - name: Chromium kur (Python)
        run: python3 -m playwright install chromium

      - name: Init teshis matrisi + tam kapak uretimi
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_COOK:-}" ]; then
            echo "::error::GEMINI_COOK secret bulunamadi."
            exit 1
          fi
          umask 077
          TARGETS="${{ inputs.targets }}"
          if [ -n "$TARGETS" ]; then
            python scripts/gemini_init_probe.py --title "${{ inputs.title }}" --targets "$TARGETS"
          else
            python scripts/gemini_init_probe.py --title "${{ inputs.title }}"
          fi

      - name: Uretim girisi testi (PW adapter + kutuphane fallback)
        if: always()
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          umask 077
          python scripts/gemini_cover.py output/probe_cover_production.jpg "Ay'a Gitmek Icin Hicbir Zaman Cikmayacak: Iste Gercek Sebep!" 2>&1 | tee /tmp/cover_production.log
          echo "--- URETIM GIRIS SONUCU ---"
          grep -E "KAPAK_OK|KAPAK-PW|basarisiz|zamana" /tmp/cover_production.log | tail -5

      - name: Rapor artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kapak-gemini-probe
          path: |
            probe_report.json
            probe_cover.jpg
            output/probe_cover_production.jpg
          if-no-files-found: warn
          retention-days: 7
