name: Shorts Kapaklarini Geriye Donuk Guncelle

on:
  workflow_dispatch:
    inputs:
      max_per_run:
        description: "Bu kosuda guncellenecek en fazla video (YouTube gunluk ozel kapak kotasi icin dusuk tut)"
        required: false
        default: "5"
        type: string
      start_after:
        description: "Devam noktasi: son islenen video ID (bos = en yeniden basla)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "1 = sadece listele ve kapak olusturma akisini dene; YouTube'a kaydetme"
        required: false
        default: "0"
        type: string
      debug:
        description: "1 = screenshot ve HTML artifact toplar (sadece sorun ayiklarken ac)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: shorts-thumbnail-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v7

      - name: Araçları Kur (Node 20 + Python 3.12 + Playwright Chromium)
        uses: ./.github/actions/setup-tools
        with:
          node: 'true'
          node_version: '20'
          node_playwright: 'true'
          playwright_chromium: 'true'
          playwright_with_deps: 'true'
          python: 'true'
          python_version: '3.12'
          pip_requirements: ''
          pip_extra: 'gemini_webapi httpx'
          node_check: 'youtube_studio_uploader.js'

      - name: YouTube oturumunu hazirla
        env:
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          STORAGE_STATE_JSON_1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${STORAGE_STATE_JSON_1}" ]; then
            printf '%s' "$STORAGE_STATE_JSON_1" > storage_state.json
          elif [ -n "${STORAGE_STATE_JSON}" ]; then
            printf '%s' "$STORAGE_STATE_JSON" > storage_state.json
          elif [ -n "${COOKIES_JSON_1}" ]; then
            printf '%s' "$COOKIES_JSON_1" > cookies.json
          elif [ -n "${COOKIES_JSON}" ]; then
            printf '%s' "$COOKIES_JSON" > cookies.json
          else
            echo "::error::YouTube oturum secret'i bulunamadi."
            exit 1
          fi
          if [ -f storage_state.json ]; then
            node -e "const d=JSON.parse(require('fs').readFileSync('storage_state.json','utf8')); if(!d.cookies||!Array.isArray(d.cookies)||!d.cookies.length) throw new Error('storage_state cookies bos'); console.log('storage_state dogrulandi ('+d.cookies.length+' cookie)')"
          else
            node -e "const d=JSON.parse(require('fs').readFileSync('cookies.json','utf8')); if(!Array.isArray(d)||!d.length) throw new Error('cookies.json gecersiz'); console.log('cookies dogrulandi ('+d.length+' cookie)')"
          fi

      - name: Gemini cookie'sini yaz
        env:
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p jeton
          if [ -z "${GEMINI_COOK}" ]; then
            echo "::error::GEMINI_COOK secret'i bulunamadi. Gemini Web UI cookie JSON'i gerekli."
            exit 1
          fi
          # GEMINI_COOK tek bir JSON objesi olmali (tum cookie'leri iceren).
          printf '%s' "$GEMINI_COOK" > jeton/gemini_cookies.json
          python3 -c "import json; d=json.load(open('jeton/gemini_cookies.json')); print('GEMINI cookie dogrulandi, keys:', sorted(d.keys()))"

      - name: Shorts kapaklarini guncelle
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID || '' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '5' }}
          START_AFTER: ${{ inputs.start_after || '' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          DEBUG: ${{ inputs.debug || '0' }}
          DEBUG_SCREENSHOTS: ${{ inputs.debug || '0' }}
          DELAY_MS: ${{ vars.DELAY_MS || '20000' }}
          STORAGE_STATE_JSON_1: ${{ secrets.STORAGE_STATE_JSON_1 }}
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: node scripts/backfill_short_thumbnails.cjs

      - name: Rapor ve yedekleri sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shorts-thumbnail-backfill-${{ github.run_number }}
          path: backfill_output/
          if-no-files-found: warn
          retention-days: 30
