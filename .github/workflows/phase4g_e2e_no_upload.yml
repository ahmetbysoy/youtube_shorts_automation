name: Faz 4G — Uctan Uca Video Uretim Testi (yayinsiz, yuklemesiz)

on:
  workflow_dispatch:
    inputs:
      target_channel:
        description: "Test edilecek kanal ID (sadece video uretimi, yukleme YOK)"
        required: false
        default: "1"
        type: string
      konu:
        description: "Test konusu (bos = sistem secer)"
        required: false
        default: ""
        type: string
      debug:
        description: "1 = ek log ve artifact toplar"
        required: false
        default: "0"
        type: string

# Minimum GITHUB_TOKEN scope: contents write is ONLY for topic_history read/write probe below.
# Upload/yayin hakki YOK; SKIP_UPLOAD=1 youtube yolunu tamamen kapatir.
permissions:
  contents: write

# Bu workflow yalnizca video uretir; hicbir sekilde YouTube'a yuklemez.
concurrency:
  group: faz4g-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-no-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: "Uretim Kapisi (skip-upload kipini dogrula)"
        run: |
          set -euo pipefail
          echo "### Faz 4G — Uctan Uca Video Uretim Testi (YÜKLEME YOK)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${{ inputs.target_channel || '1' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SKIP_UPLOAD=1 (FAZ 5 YouTube yüklemesi çalışmayacak)" >> "$GITHUB_STEP_SUMMARY"

      - name: Araçları Kur (cache destekli)
        uses: ./.github/actions/setup-tools
        id: setup
        with:
          apt_packages: ffmpeg xvfb fonts-montserrat fonts-liberation fonts-dejavu-core libass9
          python: 'true'
          python_version: '3.11'
          pip_requirements: 'requirements.txt;requirements-test.txt'
          node: 'true'
          node_version: '20'
          node_playwright: 'true'
          playwright_chromium: 'true'
          playwright_with_deps: 'false'
          python_playwright: 'true'
          node_check: 'youtube_studio_uploader.js video_fetcher.js analytics_scraper.js'

      - name: Setup Özeti
        run: |
          echo "| Kurulum Katmanı | Hit? | Süre |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| apt .deb | ${{ steps.setup.outputs.apt_cache_hit }} | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pip | ${{ steps.setup.outputs.pip_cache_hit }} | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "| node_modules | ${{ steps.setup.outputs.node_modules_cache_hit }} | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pw chromium (npm) | ${{ steps.setup.outputs.playwright_cache_hit }} | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pw chromium (py) | ${{ steps.setup.outputs.playwright_py_cache_hit }} | - |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **setup süresi** | | **${{ steps.setup.outputs.setup_duration_ms }} ms** |" >> "$GITHUB_STEP_SUMMARY"

      - name: "Ortam Dosyalarını Ayarla"
        env:
          CHANNEL_ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', inputs.target_channel || '1')] }}
          FALLBACK_ENV_FILE: ${{ secrets.ENV_FILE }}
          CHANNEL_COOKIES_JSON: ${{ secrets[format('COOKIES_JSON_{0}', inputs.target_channel || '1')] }}
          FALLBACK_COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          CHANNEL_STORAGE_STATE_JSON: ${{ secrets[format('STORAGE_STATE_JSON_{0}', inputs.target_channel || '1')] }}
          FALLBACK_STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          umask 077
          EFFECTIVE_ENV="${CHANNEL_ENV_FILE:-$FALLBACK_ENV_FILE}"
          EFFECTIVE_COOKIES="${CHANNEL_COOKIES_JSON:-$FALLBACK_COOKIES}"
          if [ -z "$EFFECTIVE_ENV" ] || [ -z "$EFFECTIVE_COOKIES" ]; then
            echo "::error::ENV_FILE_/COOKIES_JSON_ eksik!"
            exit 1
          fi
          printf '%s\n' "$EFFECTIVE_ENV" > .env
          printf '\nMATRIX_CHANNEL_ID=%s\n' "${{ inputs.target_channel || '1' }}" >> .env
          printf '%s\n' "$EFFECTIVE_COOKIES" > cookies.json
          echo "SKIP_UPLOAD=1" >> .env
          echo "FORCE_LOCAL_THUMBNAIL=1" >> .env
          if [ -n "${{ inputs.konu }}" ]; then
            printf '\nFORCED_TOPIC=%s\n' "${{ inputs.konu }}" >> .env
          fi
          echo "[OK] Ortam hazir (skip-upload=1; YouTube yüklemesi YAPILMAYACAK)."

      - name: "History Snapshot Al (test sonrası değişmemesi için)"
        id: hist_snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e_snap
          for f in .used_topics.json .media_history.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/e2e_snap/$f.before"
              echo "[OK] $f snapshot alindi ($(wc -c < $f) bytes)"
            else
              echo "[--] $f henüz yok"
            fi
          done
          # Git-tracked history dosyaları (eğer öyleyse)
          for f in data/recent_titles.json data/used_topics.json data/media_history.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/e2e_snap/$(basename $f).before"
              echo "[OK] $f snapshot alindi"
            fi
          done

      - name: Run Orchestrator (Video Üretir, Yüklemez)
        id: orchestrator
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: "1"
          MATRIX_CHANNEL_ID: ${{ inputs.target_channel || '1' }}
          SKIP_UPLOAD: "1"
          FORCE_LOCAL_THUMBNAIL: "1"
          SKIP_THUMBNAIL: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PEXELS_COOK: ${{ secrets.PEXELS_COOK }}
          PIXABAY_COOK: ${{ secrets.PIXABAY_COOK }}
          GEMINI_COOK: ${{ secrets.GEMINI_COOK }}
        run: |
          set -euo pipefail
          echo "[run] python main.py --channel_id ${{ inputs.target_channel || '1' }} --skip-upload"
          # SKIP_UPLOAD=1 kodda --skip-upload bayrağı ile de doğrulanır (main.py içinde)
          python main.py --channel_id "${{ inputs.target_channel || '1' }}" --skip-upload

      - name: "SKIP_UPLOAD Doğrulaması (logda upload yoluna girilmediğini kanıtla)"
        run: |
          set -euo pipefail
          # Log dosyalarında youtube upload / publish / youtube_studio_uploader çağrılarını tara
          echo "## SKIP_UPLOAD doğrulaması"
          shopt -s nullglob
          UPLOAD_CALLS=$(grep -lR -E "youtube_studio_uploader|upload_video|publish_to_youtube|youtube\.com/upload" output/ 2>/dev/null | wc -l || echo 0)
          echo "- upload-path log eşleşmesi: $UPLOAD_CALLS (0 beklenir)"
          # script.json'da SKIP_UPLOAD=1 olmalı
          if [ -f script.json ]; then
            SKIP_IN_SCRIPT=$(python3 -c "import json,sys; d=json.load(open('script.json')); print(d.get('skip_upload',d.get('SKIP_UPLOAD','?')))" 2>/dev/null || echo "?")
            echo "- script.json skip_upload: $SKIP_IN_SCRIPT"
          fi
          # qc_report.json'da video mevcut
          if [ -f output/qc_report.json ]; then
            echo "- qc_report mevcut"
          fi

      - name: "Final Video QC (ffprobe + tam decode + ses/goruntu senkron + siyah frame + sessizlik + clipping)"
        run: |
          python scripts/qc_final_video.py --video output/final_short.mp4

      # ── GÜVENLİK: ÖNCE sanitize/clean, SONRA artifact yükle ──
      - name: "Artifact Güvenlik Denetimi (cookie/token/secret redakte) - ARTIFACT'TAN ÖNCE"
        if: always()
        run: |
          set +e
          bash scripts/sanitize_logs.sh output 2>/dev/null || true
          echo "[OK] Log sanitization çaliştirildi."

      - name: "Gizli dosyalari temizle - ARTIFACT'TAN ÖNCE"
        if: always()
        shell: bash
        run: |
          set +e
          rm -f cookies.json .env storage_state.json
          find output -maxdepth 3 \( -iname "*cookie*" -o -iname "*storage_state*" -o -iname ".env" -o -iname "*token*" -o -iname "*credential*" -o -iname "*secret*" \) -print -delete 2>/dev/null
          # script.json içinde secret/cookie/token alanlarını sil (python ile)
          if [ -f script.json ]; then
            python3 scripts/sanitize_script_json.py script.json || echo "[warn] script.json temizlenemedi"
          fi
          echo "[OK] Gizli calisma dosyalari temizlendi."

      - name: "History Değişim Denetimi (test konuları tarihe yazılmamalı)"
        if: always()
        id: hist_check
        run: |
          set +e
          echo "## History değişim denetimi"
          CHANGED=0
          shopt -s nullglob
          for f in .used_topics.json .media_history.json; do
            if [ -f "/tmp/e2e_snap/$f.before" ]; then
              if [ -f "$f" ]; then
                if ! diff -q "/tmp/e2e_snap/$f.before" "$f" >/dev/null 2>&1; then
                  echo "[UYARI] $f DEĞİŞTİ — test konusu tarihe sızmış olabilir!"
                  diff "/tmp/e2e_snap/$f.before" "$f" | head -20
                  CHANGED=1
                else
                  echo "[OK] $f değişmemiş"
                fi
              else
                echo "[OK] $f kaldırılmış (zaten yoktu)"
              fi
            fi
          done
          if [ "$CHANGED" = "1" ]; then
            echo "::warning::History dosyaları değişmiş! SKIP_UPLOAD=1 olsa bile konu geçmişine yazma olmuş olabilir."
          fi

      - name: "Üretilen Video ve Logları Artifact olarak Yükle (ÖNCE sanitize EDİLDİ)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faz4g-e2e-video-${{ github.run_number }}
          path: |
            output/final_short.mp4
            output/cover.jpg
            output/final.ass
            output/qc_report.json
            output/scene_media_manifest.json
            script.json
          if-no-files-found: warn
          retention-days: 7
