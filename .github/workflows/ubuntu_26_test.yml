name: Ubuntu 26.04 Gecis Testi (Gecis Oncesi Deneme)

# NEDEN: GitHub 19 Ekim - 19 Kasim 2026 arasinda `ubuntu-latest` imajini
# Ubuntu 26.04'e kademeli tasiyor. Bu repo `libass9` (altyazi), `fonts-*`,
# `xvfb` ve `playwright install --with-deps` kullaniyor; 26.04'te
# kurulum/montaj kirilmasi mumkun. Ana workflow'lar `ubuntu-24.04` ile
# sabitlendi; bu workflow 26.04'te ayni adimlari deneyerek gecis riskini
# OLCER (kanal/yayin YAPMAZ - sadece ortam dogrulamasi).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_shorts.yml'
      - '.github/workflows/ubuntu_26_test.yml'
      - 'youtube_studio_uploader.js'
      - 'scripts/embed_cover_frame.py'
      - 'content_engine.py'
      - 'src/content_generation/**'
      - 'main.py'
      - 'scripts/validate_script_json.py'
      - 'scripts/gemini_web_text_probe.py'
      - 'scripts/gemini_web_story.py'
      - 'scripts/semantic_fact_check.py'
      - 'scripts/topic_history.py'
      - 'scripts/topic_persistence_probe.py'
      - '.github/workflows/topic_history_persistence_probe.yml'
      - 'schemas/**'
      - 'requirements.txt'
      - 'tests/**'
      - 'requirements-test.txt'
  workflow_dispatch:
  schedule:
    # Gunde bir (saat 03:17 - asal olmayan dakika)
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  ubuntu-26-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v7

      - name: "Sistem Bilgisi"
        run: |
          echo "### Ubuntu 26.04 Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: $(. /etc/os-release && echo "$PRETTY_NAME")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arch: $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - name: "FFmpeg + Font + Xvfb Kurulumu (26.04)"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core libass9 xvfb
          echo "ffmpeg: $(ffmpeg -version | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: "Python + Node Kurulumu (Node 24 major'lar)"
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: "Node Kurulumu"
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: "Uploader JavaScript Syntax Check"
        run: node --check youtube_studio_uploader.js

      - name: "Python Bagimliliklari"
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: "Playwright + Chromium (--with-deps)"
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright --version

      - name: "Altyazi Montaj Testi (libass9 + FontSize=56 + MarginV=250)"
        run: |
          set -euo pipefail
          ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=2 -vf \
            "drawtext=fontfile=/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf:text='TEST':fontcolor=yellow:fontsize=56:x=(w-text_w)/2:y=h-250" \
            -t 2 -r 30 /tmp/probe.mp4
          test -s /tmp/probe.mp4
          ls -la /tmp/probe.mp4
          echo "- Altyazi montaj testi: BASARILI" >> "$GITHUB_STEP_SUMMARY"

      - name: "Faz 3: Semantik + Atomik Geçmiş Testleri (mock HTTP/API; yayın yok)"
        run: python -m pytest -q tests/test_phase3_fact_checks.py tests/test_topic_history.py tests/test_gemini_web_story.py tests/test_script_json_schema.py

      - name: "Birim Testleri"
        # GitHub injects GITHUB_REPOSITORY into every job. Clear it here so
        # ordinary unit tests exercise local history, not live Contents API mode.
        env:
          GITHUB_REPOSITORY: ""
        run: python -m pytest -q tests

      - name: "Faz 3 Probe Özeti"
        run: |
          echo "- Deterministik semantic_support, exact quote ve kaynak URL aidiyeti testleri: BASARILI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contents API SHA-conflict, eşzamanlı rezervasyon, fail-closed ve başarısız koşu release testleri: BASARILI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test HTTP/API çağrıları mock'tur; canlı HTTP ve Actions run'ları ayrı kanıttır." >> "$GITHUB_STEP_SUMMARY"

      - name: "Probe Ozeti"
        run: |
          echo "### Sonuc" >> "$GITHUB_STEP_SUMMARY"
          echo "Ubuntu 26.04 uyumlu (paketler, playwright, altyazi montaji, testler)." >> "$GITHUB_STEP_SUMMARY"
